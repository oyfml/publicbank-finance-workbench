<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Bank | Finance Workbench</title>
<style>
:root{
  --brand:#ed1c24; --brand-dark:#b5121a; --brand-tint:#fdeced;
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#fcfcfb; --line:#e6e4df; --line-2:#d6d4ce;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#8a8984;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:256px 1fr;height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brandbar{background:var(--brand);padding:16px 18px 14px}
.brandbar img{height:30px;display:block}
.brandbar .sub{color:#fff;opacity:.92;font-size:12px;margin-top:8px;letter-spacing:.2px}
.nav{padding:10px 10px 20px}
.navgroup{margin-top:14px}
.navgroup h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-3);margin:0 10px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13.5px}
.navitem:hover{background:#f3f2ef;color:var(--text)}
.navitem.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600}
.navitem .ic{width:18px;text-align:center;opacity:.8}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .crumb{font-size:13px;color:var(--text-3)}
.topbar .crumb b{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.ctl select{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:var(--surface)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.sm{padding:4px 9px;font-size:12px}
.content{overflow:auto;padding:22px 24px 60px}
.page{display:none;max-width:1360px}
.page.active{display:block}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.ph h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.ph p{margin:4px 0 0;color:var(--text-2);max-width:860px}
.ph .right{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.1px}
.card .cap{margin:3px 0 10px;color:var(--text-2);font-size:12.5px}
.cardhead{display:flex;align-items:flex-start;gap:10px}
.cardhead .grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.3px;white-space:nowrap;border:1px solid}
.badge.pub{color:#1c5cab;background:#eef5fd;border-color:#cde2fb}
.badge.mod{color:#6b4e00;background:#fdf6e3;border-color:#f3dfa6}
.badge.ai{color:#4a3aa7;background:#f1effc;border-color:#d9d4f6}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .lbl{font-size:12px;color:var(--text-2);display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.4px}
.kpi .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi .sub .up{color:#006300}.kpi .sub .dn{color:#b42d2d}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;width:14px;vertical-align:3px}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--text-2)}
.chart .tick{fill:var(--text-3)}
.note{font-size:12px;color:var(--text-3);margin-top:8px}
.insight{border-left:3px solid var(--brand);background:#fff7f7;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--text);margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--text);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--text-2);border-bottom:1px solid var(--line-2);padding:7px 8px;white-space:nowrap;background:var(--surface-2)}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#faf9f7}
table.t tr.sel td{background:#fff3f3}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px}
.status .dot{width:8px;height:8px;border-radius:50%}
.st-good{color:#0a7a0a}.st-good .dot{background:var(--good)}
.st-warn{color:#8a5d00}.st-warn .dot{background:var(--warn)}
.st-serious{color:#a2461f}.st-serious .dot{background:var(--serious)}
.st-crit{color:#b42d2d}.st-crit .dot{background:var(--crit)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:12px}
.slider label{font-size:12.5px;color:var(--text-2)}
.slider output{font-weight:650;font-variant-numeric:tabular-nums;font-size:12.5px}
.slider input{grid-column:span 2;width:100%;accent-color:var(--brand)}
.slider .hint{grid-column:span 2;font-size:11px;color:var(--text-3)}
.persona{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.persona h5{margin:0 0 4px;font-size:13.5px}
.persona .meta{font-size:12px;color:var(--text-2)}
.persona .stats{display:flex;gap:12px;margin-top:8px;font-size:12px}
.persona .stats b{display:block;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--surface);cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand-dark)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--text);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#f3f2ef;border-bottom-left-radius:4px}
.msg .cite{display:block;margin-top:8px;font-size:11.5px;color:var(--text-2)}
.msg .cite span{display:inline-block;background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;margin:2px 4px 0 0}
.inputrow{display:flex;gap:8px;margin-top:10px}
.inputrow input{flex:1;border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;background:#fff}
textarea.code{width:100%;min-height:210px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border:1px solid var(--line-2);border-radius:8px;padding:10px;background:#fbfbfa;resize:vertical}
.memo{font-size:13.5px;line-height:1.6}
.memo h4{margin:14px 0 4px;font-size:14px}
.memo p{margin:4px 0}
.memo ul{margin:4px 0;padding-left:20px}
.typing::after{content:"▍";animation:blink 1s infinite;color:var(--brand)}
@keyframes blink{50%{opacity:0}}
.pack{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px 32px;max-width:900px}
.pack h2{margin:0;font-size:20px}
.pack .pk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.pack .pk div{border:1px solid var(--line);border-radius:8px;padding:10px}
.pack .pk b{display:block;font-size:19px}
.pack .pk span{font-size:11.5px;color:var(--text-2)}
.lineage .node rect{fill:#fff;stroke:var(--line-2);stroke-width:1.2}
.lineage .node.ok rect{stroke:#9fd39f}
.lineage .node.bad rect{stroke:var(--crit);stroke-width:2.2;fill:#fff5f5}
.lineage .node.path rect{stroke:var(--s1);stroke-width:1.8}
.lineage .node text{font-size:11.5px;fill:var(--text)}
.lineage .node text.s{font-size:10.5px;fill:var(--text-3)}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.steps li .k{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.steps li .k.ok{background:#e7f6e7;color:#0a7a0a}
.steps li .k.bad{background:#fde8e8;color:#b42d2d}
#tip{position:fixed;pointer-events:none;background:#1a1a19;color:#f0efec;font-size:12px;padding:7px 9px;border-radius:7px;z-index:50;opacity:0;transition:opacity .08s;max-width:280px;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transform:translateX(105%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer .db{padding:14px 16px;overflow:auto;flex:1}
.fab{position:fixed;right:24px;bottom:22px;z-index:30;background:var(--text);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab:hover{background:#2d2d2b}
.tbl-scroll{max-height:360px;overflow:auto}
.flex{display:flex;gap:10px;align-items:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.muted{color:var(--text-3)}
.big-delta{font-size:30px;font-weight:750;letter-spacing:-.5px}
.recon{display:flex;gap:16px;align-items:center;font-size:12.5px}
.recon .bar{flex:1;height:8px;background:#eeede9;border-radius:99px;position:relative}
.recon .bar span{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}
@media print{.side,.topbar,.fab,.drawer,.noprint{display:none!important}.app{display:block}.content{overflow:visible;padding:0}.page{display:none!important}#gf-board{display:block!important}}
/* ===== v2 kit additions (shared components) ===== */
.ph .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dbx{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#9a3412;background:#fff4ec;border:1px solid #fbd5bb;border-radius:999px;padding:2px 8px;white-space:nowrap}
.dbx::before{content:"";width:7px;height:7px;border-radius:2px;background:#ff3621;transform:rotate(45deg)}
.story{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:16px;font-size:13px}
.story b{color:var(--brand-dark)}
.story .q{flex:1}
.story .nx{margin-left:auto;white-space:nowrap}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.kpi.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.kpi.click:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(237,28,36,.08)}
.kpi .spark{margin-top:6px;height:26px}
/* AI answer */
div.ai{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin-top:10px}
.ai .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.ai .who .av{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#ff3621,#ed1c24);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ai .stepsl{list-style:none;margin:0 0 10px;padding:0;font-size:12px}
.ai .stepsl li{display:flex;gap:8px;align-items:baseline;padding:2px 0;color:var(--text-2)}
.ai .stepsl li .s{width:14px;flex:none;text-align:center}
.ai .stepsl li.run .s::before{content:"";display:inline-block;width:9px;height:9px;border:2px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
.ai .stepsl li.ok .s::before{content:"✓";color:var(--good);font-weight:700}
.ai .stepsl li code{font-size:11px;background:#f4f3f0;border-radius:4px;padding:0 4px}
@keyframes spin{to{transform:rotate(360deg)}}
.ai .hl{font-size:15px;font-weight:650;line-height:1.4;margin:4px 0 8px}
.ai ul.bl{margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.55}
.ai .kc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ai .kc div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.ai .kc span{display:block;font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.ai .kc b{font-size:15px}
.ai .kc b.dn{color:#b42d2d}.ai .kc b.up{color:#0a7a0a}
.ai details{margin-top:8px;font-size:12px}
.ai details summary{cursor:pointer;color:var(--text-2)}
pre.sql{background:#1d1d1b;color:#e9e7e1;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.5;overflow:auto;margin:8px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
pre.sql .k{color:#ff9e7a}pre.sql .s{color:#a6e3a1}pre.sql .c{color:#8a8984}
.ai .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ai .srcs span{font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;background:#fff;color:var(--text-2)}
.ai .srcs span::before{content:"▤ ";color:var(--brand)}
.ai .fu{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai .chartbox{margin-top:8px}
.cursor::after{content:"▍";animation:blink 1s infinite;color:var(--brand)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,18,.38);z-index:60;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(1080px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal .mh b{flex:1;font-size:15px}
.modal .mb{padding:16px 18px}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:#1a1a19;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:70}
.toast.on{opacity:1;transform:translateX(-50%)}
.skel{background:linear-gradient(90deg,#f1f0ec 25%,#f8f7f4 37%,#f1f0ec 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.fade-in{animation:fi .35s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sidefoot .live{display:flex;align-items:center;gap:6px}
.sidefoot .live i{width:7px;height:7px;border-radius:50%;background:var(--good)}

/* ===== persona sidebar ===== */
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{height:30px}
.brandrow .btxt{border-left:1px solid rgba(255,255,255,.35);padding-left:12px;color:#fff;line-height:1.2}
.brandrow .btxt b{display:block;font-size:14.5px;font-weight:700}
.brandrow .btxt span{font-size:12px;opacity:.85}
.pcard{margin:14px 12px 4px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.plbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:7px}
.pselwrap{position:relative;display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:6px 8px;transition:border-color .12s}
.pselwrap:hover{border-color:var(--brand)}
.pselwrap select{appearance:none;-webkit-appearance:none;border:0;background:transparent;flex:1;min-width:0;font-weight:650;font-size:13px;padding:3px 20px 3px 8px;text-overflow:ellipsis;cursor:pointer;outline:none}
.pav{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pchev{position:absolute;right:9px;pointer-events:none;color:var(--text-3)}
.pteam{font-size:12px;font-weight:600;color:var(--brand-dark);margin-top:8px}
.pmeta{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.45}
.navitem{gap:12px;padding:9px 12px;font-size:14px}
.navitem .nico{flex:none;opacity:.75}
.navitem.active .nico{opacity:1}
.navitem.active{box-shadow:inset 3px 0 0 var(--brand)}
.nav.swap .navgroup{animation:fi .3s ease both}
.nav.swap .navgroup:nth-child(2){animation-delay:.04s}.nav.swap .navgroup:nth-child(3){animation-delay:.08s}.nav.swap .navgroup:nth-child(4){animation-delay:.12s}.nav.swap .navgroup:nth-child(5){animation-delay:.16s}
.app{grid-template-columns:276px 1fr}
.kdial{display:inline-block;outline:none;user-select:none;touch-action:none}
.kdial:focus-visible svg{filter:drop-shadow(0 0 0 2px var(--brand))}
.kdial svg{overflow:visible}
/* ================= v3 theme: Public Bank AI Workbench look =================
   Near-white canvas with soft red glows, Inter + JetBrains Mono, white cards with
   hairline borders and a faint shadow, one hero visual per page. */
:root{
  --brand:#c8102e;--brand-dark:#a50d26;--brand-tint:#fdeef0;--brand-soft:#fff5f6;
  --bg:#f7f8fa;--surface:#fff;--surface-2:#fafafb;--line:#eceef2;--line-2:#e2e5ea;
  --text:#0a0a0a;--text-2:#4b5563;--text-3:#8b929c;
  --teal:#0f9f8f;--teal-tint:#e7f7f4;--purple:#7c5cdb;--purple-tint:#f1edfc;--amber:#d98a0b;--amber-tint:#fdf4e3;--blue:#2f6fd6;--slate:#64748b;
  --good:#10b981;--warn:#f59e0b;--crit:#dc2626;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";font-size:13.5px;color:var(--text);
  background:radial-gradient(1000px 500px at 20% -10%,rgba(200,16,46,.055),transparent 60%),radial-gradient(900px 480px at 100% 20%,rgba(165,13,38,.045),transparent 65%),linear-gradient(180deg,#fcfcfd 0%,#f7f8fa 100%);background-attachment:fixed}
.mono,.num{font-family:var(--mono);font-feature-settings:"zero"}
.app{grid-template-columns:232px 1fr}
/* ---------- sidebar ---------- */
.side{background:#fff;border-right:1px solid var(--line)}
.sbrand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid #f0f1f4}
.sbrand img{height:26px}
.sbsub{font-size:11.5px;color:var(--text-2);font-weight:500;border-left:1px solid var(--line-2);padding:2px 0 2px 10px}
.pcard{margin:12px 12px 0;padding:7px 10px;border:1px solid var(--line-2);border-radius:9px;display:flex;align-items:center;gap:9px;background:#fff;position:relative;transition:.15s;box-shadow:none}
.pcard:hover{border-color:#cfd3da;background:#fafafb}
.pav{width:24px;height:24px;border-radius:6px;background:var(--brand-tint);color:var(--brand-dark);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.pwho{flex:1;min-width:0}
.plbl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:0}
.pcard select{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:100%;font-weight:600;font-size:12.5px;padding:0 16px 0 0;cursor:pointer;outline:none;color:var(--text)}
.pchev{position:absolute;right:10px;color:var(--text-3);pointer-events:none}
.pteam{margin:8px 14px 2px;font-size:11px;line-height:1.4;color:var(--text-3)}
.pteam #pTeam{display:block;color:var(--brand-dark);font-weight:600;font-size:11.5px}
.pfocus{display:none}
.nav{padding:4px 8px 16px}
.navgroup{margin-top:0}
.navgroup h4{padding:18px 10px 6px;margin:0;font-size:10.5px;font-weight:500;color:var(--text-3);letter-spacing:.05em}
.navitem{gap:10px;padding:6px 10px;border-radius:6px;font-size:13px;color:#1f1f23;box-shadow:none!important}
.navitem:hover{background:#f5f5f7}
.navitem.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:500}
.navitem .nico{width:16px;height:16px;opacity:.7}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px}
.sfoot b{display:block;font-weight:600;font-size:12.5px}.sfoot span{color:var(--text-3);font-size:11px}
.uav{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
/* ---------- top bar ---------- */
.topbar{height:48px;padding:0 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .crumb{font-size:13px;color:var(--text-2)}.topbar .crumb b{font-weight:500;color:var(--text)}
.tpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;background:#fff}
.live{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ctl select{border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;background:#fff;font-size:12.5px}
/* ---------- page ---------- */
.content{padding:26px 28px 80px}
.page{max-width:1240px}
.ph{margin-bottom:18px;align-items:flex-start}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ph p{color:var(--text-2);font-size:13.5px;max-width:720px;margin-top:6px;line-height:1.55}
.ph .meta{font-family:var(--mono);font-size:12px;color:var(--text-2);margin-top:6px}
.ph .right{gap:8px;align-items:center}
.ph .tags{display:none}
.story{display:none}
.card{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px}
.card h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card .cap{color:var(--text-2);font-size:12.5px}
.kpis{gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(200,16,46,.07),transparent 70%)}
.kpi .lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.kpi .lbl .badge{display:none}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.kpi .val small{font-size:13px;color:var(--text-3);font-weight:500}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:4px}
.kpi .sub .up{color:#059669}.kpi .sub .dn{color:var(--crit)}
.btn{border-radius:8px;border:1px solid var(--line-2);font-size:13px;padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);border-color:var(--brand);box-shadow:0 1px 2px rgba(200,16,46,.3)}
.btn.primary:hover{background:var(--brand-dark)}
.btn.ghost{background:#fff}
.chip{border-radius:999px;font-size:12px;padding:4px 11px;border:1px solid var(--line-2);background:#fff}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:4px}
.badge{border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2px 8px}
.badge.pub{color:#1d4ed8;background:#eef4ff;border-color:#dbe6fe}.badge.mod{color:#92400e;background:var(--amber-tint);border-color:#f8e3bd}
.seg{border-radius:9px;background:#f3f4f6;border:0;padding:3px;gap:2px}
.seg button{border:0;border-radius:7px;background:transparent;font-size:12.5px;padding:5px 12px;color:var(--text-2);font-weight:500}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;background:transparent;border-bottom:1px solid var(--line)}
table.t td{border-bottom:1px solid #f2f3f5;font-size:13px}
table.t td.n{font-family:var(--mono);font-size:12.5px}
.chart text{font-family:var(--mono);font-size:10.5px}
.insight{border:1px solid #f6c9d0;background:var(--brand-soft);border-left:1px solid #f6c9d0;border-radius:10px;padding:12px 16px;color:#3d0a12;font-size:13px;line-height:1.55}
.insight b{color:var(--brand-dark)}
.fab{background:#fff;color:var(--text);border:1px solid var(--line-2);box-shadow:0 6px 20px rgba(16,24,40,.10);font-weight:600;font-size:13px}
.fab span{color:var(--brand)}
.fab:hover{background:#fafafb}
/* Databricks trace: subtle mono chips, never loud */
.dbx{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-2);background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
.dbx::before{width:6px;height:6px;border-radius:2px;background:#ff3621;transform:rotate(45deg)}
/* AI answer restyle */
div.ai{border-radius:12px;border-color:var(--line);box-shadow:var(--shadow)}
div.ai .who .av{background:var(--brand);border-radius:7px}
.ai .hl{font-weight:600;letter-spacing:-.01em}
.ai .kc b{font-family:var(--mono)}
pre.sql{background:#0f1117;border-radius:10px}

/* ================= v3 kit components ================= */
/* tabs (underline style, like the reference Signals / Propensity / Journey Map) */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}
.vtabs button{border:0;background:none;padding:9px 14px;font-size:13.5px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;font-weight:500}
.vtabs button:hover{color:var(--text)}
.vtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.vtabs .cnt{font-family:var(--mono);font-size:10.5px;background:var(--brand-tint);color:var(--brand-dark);border-radius:999px;padding:0 6px}
.vpane{display:none}.vpane.on{display:block;animation:fi .3s ease both}
/* pill tabs (Rhythm / Deal journeys style) */
.ptabs{display:inline-flex;gap:4px;background:#f3f4f6;border-radius:12px;padding:4px}
.ptabs button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--text);cursor:pointer;display:flex;gap:7px;align-items:center}
.ptabs button.on{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(200,16,46,.35)}
/* dark hero canvas (like the mule ring graph) */
.stage{background:#0d1020;border-radius:14px;color:#e6e8ef;position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.stage .legend2{position:absolute;right:14px;top:14px;display:flex;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#c9ccd6;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;background:rgba(13,16,32,.7)}
.stage .legend2 i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.stage text{fill:#c9ccd6;font-family:var(--mono)}
/* timeline scrubber with play (like RING TIMELINE) */
.tline{background:#0d1020;border-radius:14px;padding:14px 18px 12px;color:#e6e8ef;margin-top:12px}
.tline .th{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#aeb3c2}
.tline .th b{color:#ff6b7f;font-weight:600}
.tline .th .t{margin-left:auto;color:#fff;font-weight:600}
.tline .play{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:10px}
.tline .track{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:14px 6px 6px;cursor:pointer}
.tline .fillb{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#f59e0b,#ef4444)}
.tline .knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.tline .stops{display:flex;justify-content:space-between;margin-top:8px}
.tline .stops div{font-family:var(--mono);font-size:10.5px;color:#d7dae3;text-align:center;cursor:pointer;flex:1}
.tline .stops div span{display:block;color:#7d8396;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.tline .stops div.on{color:#fff}
.tline.light{background:#fff;border:1px solid var(--line);color:var(--text)}
.tline.light .th{color:var(--text-3)}.tline.light .th .t{color:var(--text)}.tline.light .play{border-color:var(--line-2);color:var(--text);background:#fff}
.tline.light .track{background:#eef0f3}.tline.light .stops div{color:var(--text)}.tline.light .stops div span{color:var(--text-3)}
/* score ring (like the 718 of 850 credit score) */
.ring{position:relative;display:inline-grid;place-items:center}
.ring .rv{position:absolute;text-align:center}
.ring .rv b{display:block;font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em}
.ring .rv span{font-size:11.5px;color:var(--text-3)}
.ring .rv em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--teal);margin-top:2px}
/* evidence / action cards (Next Best Action style) */
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.acard:hover{border-color:#e3c3c9}
.acard .ab{display:flex;gap:14px;padding:16px 18px}
.acard .rk{width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.acard h4{margin:0 0 4px;font-size:14.5px;font-weight:600}
.acard p{margin:0;color:var(--text-2);font-size:13px;line-height:1.55}
.acard .facts{display:flex;gap:28px;margin-top:10px}
.acard .facts div span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.acard .facts div b{font-family:var(--mono);font-size:13px;font-weight:600}
.acard .af{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid #f2f3f5;background:#fcfcfd}
.acard.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.08)}
/* detail side panel */
.dpanel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.dpanel .dh2{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dpanel .dh2::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--brand)}
.dpanel .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f2f3f5;font-size:12.5px}
.dpanel .row b{font-family:var(--mono);font-weight:500}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.statgrid div{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.statgrid span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.statgrid b{font-family:var(--mono);font-size:15px;font-weight:600}
/* agent run (button reveals steps, like Enable Agentic AI Decisioning) */
.arun{border:1px dashed var(--line-2);border-radius:10px;padding:14px;color:var(--text-3);font-size:12.5px;text-align:center;font-style:italic}
.arun.going{border-style:solid;text-align:left;font-style:normal;color:var(--text)}
.arun .st{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12.5px;opacity:0;transform:translateY(4px);transition:.3s}
.arun .st.v{opacity:1;transform:none}
.arun .st i{width:16px;height:16px;border-radius:50%;flex:none;margin-top:1px;border:2px solid var(--line-2)}
.arun .st.ok i{border-color:var(--good);background:var(--good);box-shadow:inset 0 0 0 3px #fff}
.arun .st.run i{border-top-color:var(--brand);animation:spin .7s linear infinite}
.arun .st code{font-family:var(--mono);font-size:11px;color:var(--text-2);background:#f4f5f7;border-radius:4px;padding:1px 5px}
.arun .st .tm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
/* trace footer line: "trace req_a912f4 · rules_v3.4" */
.trace{font-family:var(--mono);font-size:11px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trace span{border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;background:#fff;color:var(--text-2)}
/* toggle switch */
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.sw input{display:none}.sw i{width:32px;height:18px;border-radius:99px;background:#d6d9df;position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--brand)}.sw input:checked+i::after{left:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:1250px){.g12{grid-template-columns:1fr}}
.reveal{animation:fi .45s ease both}
/* ===== CFO briefing (cfo-) ===== */
#pg-cfo-brief .kpi.click{cursor:pointer}
.cfo-herocard{padding:18px 20px 16px}
.cfo-hh{display:flex;align-items:flex-start;gap:16px}
.cfo-hh>div:first-child{flex:1}
.cfo-hh .cap{margin-top:4px}
.cfo-big{display:flex;align-items:center;gap:14px}
.cfo-bm{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cfo-bm em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.cfo-bv{text-align:right}
.cfo-bv .cfo-bl0{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.cfo-bv b{display:block;font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums;min-width:128px}
.cfo-dl{font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;background:#f1f2f4;color:var(--text-2)}
.cfo-dl.dn{background:var(--brand-tint);color:var(--brand-dark)}
.cfo-nii{font-size:11.5px;color:var(--brand-dark);transition:opacity .3s}
.cfo-hero{margin-top:8px;min-height:300px}
.cfo-svg{display:block;overflow:visible}
.cfo-svg rect{transition:fill .2s}
.cfo-svg .cfo-tk{font-family:var(--mono);font-size:10.5px;fill:var(--text-3)}
.cfo-svg .cfo-zl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;fill:var(--text-3)}
.cfo-svg .cfo-zl.red{fill:var(--brand)}
.cfo-svg .cfo-vl{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--text-2)}
.cfo-svg .cfo-vl.tot{fill:var(--text);font-size:12px}
.cfo-svg .cfo-vl.proj{fill:var(--brand-dark)}
.cfo-svg .cfo-xl text{font-size:11.5px;fill:var(--text-2)}
.cfo-svg .cfo-xl text.b{font-weight:600;fill:var(--text);font-family:var(--mono)}
.cfo-svg .cfo-xl text.s{font-family:var(--mono);font-size:10px;fill:var(--brand-dark)}
#cfo_tl{margin-top:6px}
.cfo-tr{margin-top:12px}
/* before ALCO */
.cfo-q5{display:flex;flex-direction:column}
.cfo-qsub{font-size:12.5px;color:var(--text-2);margin:-2px 0 8px}
.cfo-q{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:13px 6px;border-bottom:1px solid #f2f3f5;cursor:pointer;border-radius:8px;transition:background .15s}
.cfo-q:hover{background:#fafafb}
.cfo-q:hover .cfo-chev{transform:translateX(3px);color:var(--brand)}
.cfo-qt{flex:1;min-width:0}
.cfo-qt b{display:block;font-size:13.5px;font-weight:600}
.cfo-qt span{display:block;font-size:11.5px;color:var(--text-3);margin-top:1px}
.cfo-qv{font-size:14px;font-weight:600;white-space:nowrap}
.cfo-chev{color:var(--text-3);font-size:18px;transition:transform .15s,color .15s}
.cfo-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.cfo-dot.red{background:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.12);animation:cfoPulse 2s ease-in-out infinite}
.cfo-dot.amber{background:var(--amber);box-shadow:0 0 0 3px rgba(217,138,11,.13)}
.cfo-dot.teal{background:var(--teal);box-shadow:0 0 0 3px rgba(15,159,143,.13)}
@keyframes cfoPulse{50%{box-shadow:0 0 0 6px rgba(200,16,46,.04)}}
.cfo-qleg{display:flex;gap:14px;margin-top:auto;padding-top:14px;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.cfo-qleg span{display:flex;align-items:center;gap:6px}
.cfo-qleg .cfo-dot{animation:none;box-shadow:none;width:7px;height:7px}
/* decisions */
.cfo-dech{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.cfo-dech h3{margin:0;font-size:15px;font-weight:600}
.cfo-dcap{font-size:12px;margin-left:auto}
.cfo-open{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--brand-tint);color:var(--brand-dark);border-radius:999px;padding:2px 9px;transition:background .3s,color .3s}
.cfo-open.clear{background:var(--teal-tint);color:var(--teal)}
.cfo-open.bump{animation:cfoBump .45s ease}
@keyframes cfoBump{40%{transform:scale(1.25)}}
.cfo-dec{margin-bottom:10px}
.cfo-dec .ab{align-items:center;padding:13px 18px}
.cfo-dg{flex:1;min-width:0}
.cfo-dg h4{margin:0 0 2px}
.cfo-dg p{font-size:12.5px}
.cfo-dm{text-align:right;min-width:150px}
.cfo-dm span{display:block;font-size:11.5px;color:var(--text-3)}
.cfo-dm b{font-family:var(--mono);font-size:12px;font-weight:600}
.cfo-da{display:flex;gap:8px;align-items:center;min-width:170px;justify-content:flex-end}
.cfo-dec.done{background:#fbfdfc;border-color:#cdeee8}
.cfo-dec.done h4,.cfo-dec.done p{color:var(--text-3)}
.cfo-dec.done .rk{background:var(--teal);transition:background .3s}
.cfo-tick{width:26px;height:26px;border-radius:50%;background:var(--teal);display:grid;place-items:center;animation:cfoPop .45s cubic-bezier(.3,1.6,.5,1) both}
.cfo-tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:cfoDraw .35s .18s ease forwards}
.cfo-ok{font-size:12.5px;font-weight:600;color:var(--teal);animation:fi .3s .2s ease both}
@keyframes cfoPop{from{transform:scale(.2);opacity:0}}
@keyframes cfoDraw{to{stroke-dashoffset:0}}
/* ALCO brief */
.cfo-brief{display:none;margin-bottom:16px;border-color:#f3d3d8;background:linear-gradient(180deg,#fffafa,#fff)}
.cfo-brief.on{display:block;animation:fi .35s ease both}
.cfo-bhd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.cfo-bhd b{flex:1;font-size:14px;font-weight:600}
.cfo-bav{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
#cfo_brun.arun{max-height:260px;overflow:hidden;transition:max-height .45s ease,opacity .3s,padding .3s,margin .3s}
#cfo_brun.cfo-fold{max-height:0;opacity:0;padding:0 14px;border-width:0;margin:0}
.cfo-bl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f4eef0;animation:fi .4s ease both}
.cfo-bl b{font-size:13px;font-weight:600}
.cfo-bl p{margin:2px 0 0;font-size:13px;color:var(--text-2);line-height:1.55}
.cfo-bl p b{color:var(--text);font-weight:600}
.cfo-bn{width:22px;height:22px;border-radius:6px;background:var(--brand-tint);color:var(--brand-dark);font-family:var(--mono);font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.cfo-bf{display:flex;gap:8px;align-items:center;padding-top:12px;font-size:11.5px;animation:fi .4s ease both}
.cfo-sg{margin:auto 0 0;padding-top:14px}
.cfo-qleg{padding-top:10px;margin-top:0!important}
/* ===== cfo-market (cfm-) ===== */
.cfm-card{padding:18px 20px 16px}
.cfm-hh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.cfm-hh .cap{margin-top:3px;max-width:520px}
.cfm-svg{display:block;overflow:visible}
.cfm-svg .tick{font-family:var(--mono);font-size:10.5px;fill:#8b929c}
.cfm-q{min-height:430px}
.cfm-b{cursor:pointer;transition:transform .95s cubic-bezier(.55,.05,.2,1)}
.cfm-b .cfm-halo{opacity:0;transition:opacity .2s}
.cfm-b:hover .cfm-halo{opacity:.35}
.cfm-b.sel .cfm-halo{opacity:1}
.cfm-b.pbb .cfm-halo{stroke:#c8102e}
.cfm-bi{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;pointer-events:none}
.cfm-bi.w{fill:#fff}
.cfm-bn{font-size:11.5px;font-weight:600;fill:#1f2328;pointer-events:none;paint-order:stroke;stroke:#fcfcfd;stroke-width:3px}
.cfm-bn.pbb{fill:#a50d26}
.cfm-bv{font-family:var(--mono);font-size:9.5px;fill:#8b929c;pointer-events:none;paint-order:stroke;stroke:#fcfcfd;stroke-width:3px}
.cfm-pulse{animation:cfmPulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cfmPulse{50%{transform:scale(1.18);opacity:.04}}
.cfm-lg{transition:transform .95s cubic-bezier(.55,.05,.2,1)}
.cfm-mv{transition:transform .95s cubic-bezier(.55,.05,.2,1)}
.cfm-ml{font-family:var(--mono);font-size:9.5px;fill:#8b929c;letter-spacing:.04em}
.cfm-best{transition:x .9s,width .9s,height .9s}
.cfm-ql{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;fill:#9aa1ab}
.cfm-ql.good{fill:#0b7f72}
.cfm-al{font-size:11px;fill:#4b5563;font-weight:500}
.cfm-fade{animation:cfmFade .6s ease both}
@keyframes cfmFade{from{opacity:0}to{opacity:1}}
.cfm-ins{margin-top:12px}
.cfm-tr{margin-top:12px}
/* side panel */
.cfm-dp{align-self:start}
.cfm-swap{animation:fi .35s ease both}
.cfm-dph{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #f2f3f5;margin-bottom:4px;min-height:44px}
.cfm-dph b{display:block;font-size:15px;font-weight:600}
.cfm-dph span{font-size:11px;color:var(--text-3)}
.cfm-logo{display:block;max-width:120px;object-fit:contain}
.cfm-ini{display:inline-grid;place-items:center;border-radius:50%;border:1.6px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);font-family:var(--mono);font-size:10px;font-weight:700;flex:none;letter-spacing:.02em}
.cfm-ini.pbb{background:var(--brand);border-color:var(--brand);color:#fff}
.cfm-rows{margin-top:4px}
.cfm-r{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f4f5f7;font-size:12.5px}
.cfm-r span{color:var(--text-2)}
.cfm-r.h{padding:2px 0 4px}.cfm-r.h span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}.cfm-r.h span:nth-child(2){text-align:right}.cfm-r.h span:last-child{text-align:right}
.cfm-r b{font-weight:600;font-size:12.5px}
.cfm-r em{font-style:normal;font-size:11px;text-align:right;color:var(--text-3)}
.cfm-r em.w{color:#0b7f72}.cfm-r em.l{color:var(--brand)}
.cfm-sens{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:9px;background:#f7f8fa;font-size:12px;color:var(--text-2)}
.cfm-sens b{margin-left:auto;font-size:12.5px;color:var(--text)}
.cfm-sens i{font-style:normal;font-size:10px;color:#92400e;background:var(--amber-tint);border-radius:99px;padding:1px 7px;cursor:help}
.cfm-note{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.45}
.cfm-srcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cfm-srcs .badge{font-weight:500}
.cfm-pick{display:flex;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid #f2f3f5}
.cfm-pick button{border:0;background:none;padding:3px;border-radius:50%;cursor:pointer;opacity:.55;transition:.15s}
.cfm-pick button:hover,.cfm-pick button.on{opacity:1}
.cfm-pick button.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--brand)}
/* scorecard */
.cfm-leg{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.cfm-leg i{font-style:normal;width:20px;height:18px;border-radius:5px;display:grid;place-items:center;font-weight:600}
.cfm-leg span{margin:0 4px}
.cfm-sc{--cols:200px 74px repeat(8,minmax(0,1fr)) 96px;overflow-x:auto}
.cfm-sh,.cfm-sr{display:grid;grid-template-columns:var(--cols);gap:5px;align-items:center}
.cfm-sh{padding:0 6px 8px;border-bottom:1px solid var(--line)}
.cfm-sh .cfm-c0{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.cfm-sh button{border:0;background:none;cursor:pointer;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);padding:6px 2px;border-radius:7px;line-height:1.25}
.cfm-sh button i{display:block;font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-size:9.5px;color:#a3a9b2;margin-top:2px}
.cfm-sh button:hover{background:#f5f6f8;color:var(--text)}
.cfm-sh button.on{color:var(--brand);background:var(--brand-soft)}
.cfm-sh button.on::after{content:"▼";display:block;font-size:7px;margin-top:2px}
.cfm-sb{position:relative;margin-top:6px}
.cfm-sr{position:absolute;left:0;right:0;top:0;height:46px;padding:0 6px;border-radius:10px;transition:transform .65s cubic-bezier(.55,.05,.2,1),background .2s;cursor:pointer}
.cfm-sr:hover{background:#f8f9fb}
.cfm-sr.pbb{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand);z-index:2}
.cfm-sr .cfm-c0{display:flex;align-items:center;gap:10px;min-width:0}
.cfm-sr .cfm-c0 b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.cfm-sr .cfm-c0 em{display:block;font-style:normal;font-size:10.5px;color:var(--text-3)}
.cfm-sr.pbb .cfm-c0 b{color:var(--brand-dark)}
.cfm-cell{height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;position:relative;transition:box-shadow .2s,transform .2s}
.cfm-cell sup{position:absolute;top:3px;right:5px;font-size:8.5px;opacity:.7;font-weight:700}
.cfm-cell.hot{box-shadow:0 0 0 2px #0a0a0a22;transform:scale(1.04)}
.cfm-cell.ov{background:#f3f4f6;color:var(--text)}
.cfm-sr.pbb .cfm-cell.ov{background:#fff}
.cfm-cell.ta{justify-content:flex-start;gap:6px;background:none;font-weight:500;color:var(--text-2)}
.cfm-cell.ta i{display:block;height:8px;border-radius:4px;background:#cbd2db;max-width:52px;flex:none}
.cfm-sr.pbb .cfm-cell.ta i{background:var(--brand)}
.cfm-cell.ta i{width:52px}
.cfm-foot{font-size:11.5px;margin-top:12px;line-height:1.5}
/* deposit pricing */
.cfm-leg2{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--text-2);justify-content:flex-end;max-width:640px}
.cfm-leg2 span{display:flex;align-items:center;gap:5px}
.cfm-leg2 .cfm-ini{font-size:7px;border-width:1.2px}
.cfm-fd{min-height:360px}
.cfm-zl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;fill:#8b929c}
.cfm-ten{font-family:var(--mono);font-size:12px;font-weight:600;fill:#1f2328}
.cfm-fdd{transition:transform .35s cubic-bezier(.3,.7,.2,1);cursor:default}
.cfm-fdd.pbb circle{filter:drop-shadow(0 2px 4px rgba(200,16,46,.35))}
.cfm-fdi{font-family:var(--mono);font-size:8.5px;font-weight:700;pointer-events:none}
.cfm-fdi.w{fill:#fff}
.cfm-fdv{font-family:var(--mono);font-size:10px;fill:#4b5563;font-weight:600}
.cfm-fdv.pbb{fill:#c8102e;font-size:11px}
.cfm-bdl{font-family:var(--mono);font-size:10px;fill:#c8102e}
.cfm-dial{align-self:start}
.cfm-dw{display:flex;justify-content:center;margin:4px 0 2px}
.cfm-dial .statgrid b{font-size:15px}
.cfm-dial .statgrid b small{font-size:11px;color:var(--text-3);font-weight:500}
.cfm-dial .statgrid b.up{color:#0b7f72}.cfm-dial .statgrid b.dn{color:var(--brand)}
.cfm-pre{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cfm-pre .chip{font-family:var(--mono);font-size:11px;padding:3px 9px;cursor:pointer}
.cfm-mnote{font-size:11px;color:var(--text-3);line-height:1.45}
/* brief */
.cfm-bcard{min-height:360px}
.cfm-bhd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cfm-bhd b{font-size:14.5px;font-weight:600}
.cfm-bav{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
#cfm_brun.cfm-fold,.cfm-fold{max-height:0;padding:0!important;border:0!important;overflow:hidden;opacity:0;transition:.5s}
#cfm_brun{transition:.5s;max-height:420px}
.cfm-bl{display:grid;grid-template-columns:76px 1fr;gap:4px 14px;padding:14px 4px;border-bottom:1px solid #f2f3f5;animation:fi .45s ease both}
.cfm-bl p{margin:0;font-size:13.5px;line-height:1.55;color:#1f2328}
.cfm-bl p b{font-weight:600;color:var(--text)}
.cfm-cites{grid-column:2;display:flex;flex-wrap:wrap;gap:5px}
.cfm-cite{font-family:var(--mono);font-size:10.5px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;background:#fff}
.cfm-cite::before{content:"↗ ";color:var(--brand)}
.cfm-tag{align-self:start;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 0;text-align:center;margin-top:2px}
.cfm-tag.up{background:var(--teal-tint);color:#0b7f72}.cfm-tag.dn{background:var(--brand-tint);color:var(--brand-dark)}
.cfm-tag.am{background:var(--amber-tint);color:#92400e}.cfm-tag.go{background:var(--brand);color:#fff}
.cfm-bf{display:flex;align-items:center;gap:8px;padding-top:12px;animation:fi .45s ease both}
.cfm-cov{align-self:start}
.cfm-cv{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f2f3f5;font-size:13px}
.cfm-cv>span{width:40px;height:40px;border-radius:10px;background:#f3f4f6;display:grid;place-items:center;flex:none}
.cfm-cv>span b{font-family:var(--mono);font-size:16px;color:var(--text-3)}
.cfm-cv>span b.on{color:var(--brand)}
.cfm-cv em{display:block;font-style:normal;font-size:11px;color:var(--text-3)}
/* ===== 20_ma_a: ma-balance, ma-opr, ma-funding (prefix maA-) ===== */
.maA-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;position:relative;min-width:0}
.maA-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.maA-hd .grow{flex:1;min-width:0}
.maA-hd h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.maA-hd .cap{font-size:12px;color:var(--text-3);margin-top:2px}
.maA-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin:-2px 0 6px}
.maA-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.maA-leg i.ln{width:14px;height:2.5px;border-radius:2px;vertical-align:3px}
.maA-foot{display:flex;align-items:center;gap:14px;margin-top:14px}
.maA-foot .insight{flex:1;margin:0}
.maA-trace{margin-top:12px}
.maA-ax{font-family:var(--mono);font-size:10px;fill:#a3a9b2}
.maA-sent{font-size:13px;color:var(--text-2);margin:10px 0 0;line-height:1.55}
.maA-sent b{color:var(--text);font-family:var(--mono);font-weight:600}
.maA-bolt{width:14px;height:14px}
.btn.primary .maA-bolt{fill:#fff}
.btn[disabled]{opacity:.6;cursor:default}

/* compact range sliders */
.maA-sl{margin:0 0 14px}
.maA-sl .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.maA-sl label{font-size:12.5px;color:var(--text-2)}
.maA-sl output{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text)}
.maA-sl .h{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:3px}
input[type=range].maA-r{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;margin:9px 0 2px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--brand) 0,var(--brand) var(--p,50%),#e5e7eb var(--p,50%),#e5e7eb 100%)}
input[type=range].maA-r::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:0 1px 4px rgba(200,16,46,.25);transition:transform .12s}
input[type=range].maA-r:active::-webkit-slider-thumb{transform:scale(1.15)}

/* ---------- ma-balance: tide ladder ---------- */
.maA-tide svg{display:block;overflow:visible}
.maA-col{cursor:pointer}
.maA-col .bg{opacity:0;transition:opacity .2s}
.maA-col:hover .bg{opacity:.55}
.maA-col.sel .bg{opacity:1}
.maA-col.sel .bl{font-weight:700;fill:var(--brand-dark)}
.maA-col .bl{font-family:Inter,sans-serif;font-size:11.5px;fill:#4b5563}
.maA-col .gl{font-family:var(--mono);font-size:11.5px;font-weight:700}
.maA-col .vl{font-family:var(--mono);font-size:10px;fill:#8b929c}
.maA-ghost{transition:opacity .45s}
.maA-cumlab{font-family:var(--mono);font-size:10.5px;font-weight:700;fill:var(--purple)}
.maA-runov{position:absolute;left:62px;top:96px;width:340px;background:#fff;border-radius:12px;box-shadow:0 12px 36px rgba(16,24,40,.16);border:1px solid var(--line);padding:12px 14px;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;z-index:3}
.maA-runov.on{opacity:1;transform:none}
.maA-runov .arun{border:0;padding:0}
.maA-runov .rh{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.maA-bdiv{height:1px;background:var(--line);margin:4px -18px 14px}
.maA-drv{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-top:10px}
.maA-dl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);padding:6px 0 0}
.maA-dl b{font-family:var(--mono);font-weight:600;color:var(--text-2)}
.statgrid b.up{color:var(--teal)}.statgrid b.dn{color:var(--brand)}
.maA-modeb{display:flex;align-items:center;gap:10px}
.maA-rst{font-size:12px;color:var(--text-3);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.maA-rst:hover{color:var(--brand)}

/* repricing heatmap */
.maA-hm svg{display:block}
.maA-hc rect{transition:fill .45s ease,stroke .15s}
.maA-hc{cursor:pointer}
.maA-hc:hover rect{stroke:#0a0a0a;stroke-width:1.5}
.maA-hc.sel rect{stroke:var(--brand);stroke-width:2.2}
.maA-hc text{font-family:var(--mono);font-size:11.5px;font-weight:600;pointer-events:none;transition:fill .3s}
.maA-hrl{font-size:12.5px;fill:#1f2937}
.maA-hrl.on{fill:var(--brand-dark);font-weight:600}
.maA-hch{font-family:var(--mono);font-size:11px;font-weight:600;fill:#4b5563}
.maA-hch.on{fill:var(--brand-dark)}
.maA-hsub{font-family:var(--mono);font-size:9.5px;fill:#a3a9b2}
.maA-grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;fill:#a3a9b2}
.maA-rdet{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-size:12.5px;color:var(--text-2);min-height:42px}
.maA-rdet .k{font-weight:600;color:var(--text)}
.maA-rdet b{font-family:var(--mono);font-weight:600;color:var(--text)}
.maA-rdet span.p{font-family:var(--mono);font-size:11.5px;background:#f6f7f9;border-radius:6px;padding:2px 7px}
.maA-tie{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid #bfe7e0;background:var(--teal-tint);color:#0b7a6e;white-space:nowrap}
.maA-tie.warn{border-color:#f8e3bd;background:var(--amber-tint);color:#92400e}

/* ---------- ma-opr ---------- */
.maA-ohero{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;margin-bottom:22px}
.maA-dialc{display:flex;flex-direction:column;align-items:center;padding:18px 20px}
.maA-dialc .maA-hd{align-self:stretch}
.maA-dialw{display:flex;justify-content:center;padding:10px 0 6px}
.maA-dialc .btn.primary{width:100%;justify-content:center;padding:10px 14px;font-weight:600;margin-top:6px}
