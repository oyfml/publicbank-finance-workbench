    if(n.r<=8){txt(g,-16,4,n.l,{'text-anchor':'end',class:'plat-l'});}
    else{txt(g,0,n.r+17,n.l.toUpperCase(),{'text-anchor':'middle',class:'plat-l'});if(n.sub)txt(g,0,n.r+30,n.sub,{'text-anchor':'middle',class:'plat-s'});}
    el('circle',{r:n.r+12,fill:'transparent',class:'plat-hit'},g);
    g.addEventListener('click',e=>{e.stopPropagation();platSelect(P.sel===id?null:id);});
    g.setAttribute('data-tip',`${n.l}\n${n.k}\nClick to light its path`);P.nodes[id]=g;});
  s.addEventListener('click',()=>{if(P.sel)platSelect(null);});
}
function platLoop(t){const pg=$('pg-platform');if(!pg||!pg.classList.contains('active')){P.raf=0;return;}
  P.parts.forEach(q=>{const k=((t/1000)*(52/q.e.len)+q.o)%1;const pt=q.e.p.getPointAtLength(k*q.e.len);q.c.setAttribute('cx',pt.x);q.c.setAttribute('cy',pt.y);q.c.setAttribute('opacity',(Math.sin(k*Math.PI)*.9).toFixed(2));});
  P.raf=requestAnimationFrame(platLoop);}
function platStart(){if(!P.raf)P.raf=requestAnimationFrame(platLoop);}
const closure=id=>new Set([...closureUp(id),...closureDn(id)]);
function applyHi(nodes,edgeOn){
  Object.entries(P.nodes).forEach(([id,g])=>{g.classList.toggle('dim',!!nodes&&!nodes.has(id));g.classList.toggle('on',!!nodes&&nodes.has(id));g.classList.toggle('sel',P.sel===id);});
  Object.entries(P.edges).forEach(([k,e])=>{const on=edgeOn?edgeOn(e):(!nodes||nodes.has(e.a)&&nodes.has(e.b));e.g.classList.toggle('dim',!on);});
  P.parts.forEach(q=>q.c.classList.toggle('dim',q.e.g.classList.contains('dim')));}
function clearLits(){Object.entries(P.lits).forEach(([k,l])=>l.setAttribute('stroke-dashoffset',P.edges[k].len));P.pulse.setAttribute('opacity',0);}
function platSelect(id){P.sel=id;
  if(id){if(P.tl)P.tl.stop();P.tr=null;P.ptabs.set('explore');clearLits();const set=closure(id);applyHi(set);
    Object.entries(P.lits).forEach(([k,l])=>{const e=P.edges[k];if(set.has(e.a)&&set.has(e.b)){l.style.transition='stroke-dashoffset .7s ease';l.setAttribute('stroke-dashoffset',0);}});
    setTimeout(()=>Object.values(P.lits).forEach(l=>l.style.transition=''),800);
    const n=N[id],inf=INFO[id];
    $('plat_panel').innerHTML=`<div class="dh2">${n.k}</div><h3 class="plat-h3"><i style="background:${n.c}"></i>${n.l}</h3><p class="plat-p">${inf[0]}</p>
      <div class="plat-sec">Pages that use it</div><div class="plat-chips">${inf[1].map(pg=>`<button class="chip" data-go="${pg}">${navLabel(pg)}</button>`).join('')}</div>
      <div class="plat-sec">Sample objects</div><div class="plat-objs">${inf[2].map(o=>`<code>${o}</code>`).join('')}</div>
      <div class="statgrid"><div><span>Upstream</span><b>${closureUp(id).size-1}</b></div><div><span>Downstream</span><b>${closureDn(id).size-1}</b></div></div>
      <button class="btn sm" id="plat_clr">Clear selection</button>`;
    $('plat_panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('plat_clr').onclick=()=>platSelect(null);
    $('plat_panel').classList.remove('fl');void $('plat_panel').offsetWidth;$('plat_panel').classList.add('fl');}
  else{clearLits();applyHi(null);platIntro();}}
const closureUp=id=>{const up=new Set([id]);let st=[id];while(st.length){const n=st.pop();E.forEach(([a,b])=>{if(b===n&&!up.has(a)){up.add(a);st.push(a)}})}return up;};
const closureDn=id=>{const dn=new Set([id]);let st=[id];while(st.length){const n=st.pop();E.forEach(([a,b])=>{if(a===n&&!dn.has(b)){dn.add(b);st.push(b)}})}return dn;};
function platIntro(){$('plat_panel').innerHTML=`<div class="dh2">How to read this</div><h3 class="plat-h3">From core banking to the CFO briefing</h3><p class="plat-p">Eight sources land through Lakeflow into Unity Catalog. Metric views and models sit on gold; Genie and Agent Bricks answer in this app.</p>
   <div class="statgrid"><div><span>Sources</span><b>8</b></div><div><span>Governed tables</span><b>186</b></div><div><span>Genie spaces</span><b>3</b></div><div><span>MLflow models</span><b>3</b></div></div>
   <p class="plat-hint">Click any node to light its path, or trace a figure below.</p>`;}
/* trace a figure */
function trSet(k){const T=TR[k];P.tr=k;P.sel=null;clearLits();
  const set=new Set([...T.seq.map(s=>s[0]),...T.extra]);const pairs=new Set(T.seq.slice(1).map((s,i)=>ekey(T.seq[i][0],s[0])));T.extra.forEach(x=>pairs.add(ekey(x,'lf')));
  applyHi(set,e=>pairs.has(ekey(e.a,e.b)));
  if(P.tl)P.tl.stop();const host=$('plat_tl');P.tl=timeline(host,{title:'Trace · '+T.l,status:'',speed:650,stops:T.seq.map(s=>({l:N[s[0]].l.split(' ')[0],s:KS[s[0]]||'source',t:s[1]})),onChange:(i,f)=>trDraw(f*(T.seq.length-1))});
  trDraw(0);}
function trDraw(p){const T=TR[P.tr];if(!T)return;P.pos=p;const n=T.seq.length;const i=Math.min(n-2,Math.floor(p)),t=p-i;
  T.seq.forEach((s,k)=>{if(k===0)return;const key=ekey(T.seq[k-1][0],s[0]);const l=P.lits[key],e=P.edges[key];const f=k-1<i?1:k-1===i?t:0;l.setAttribute('stroke-dashoffset',e.len*(1-(p>=n-1?1:f)));});
  T.extra.forEach(x=>{const key=ekey(x,'lf');P.lits[key].setAttribute('stroke-dashoffset',p>=0.98?0:P.edges[key].len);});
  const e=P.edges[ekey(T.seq[i][0],T.seq[i+1][0])];const pt=e.p.getPointAtLength(e.len*(p>=n-1?1:t));
  P.pulse.setAttribute('cx',pt.x);P.pulse.setAttribute('cy',pt.y);P.pulse.setAttribute('opacity',1);
  T.seq.forEach((s,k)=>P.nodes[s[0]].classList.toggle('hit',k<=p+0.02));
  const cur=Math.min(n-1,Math.round(p));if(P.tl)P.tl.status(Math.round(p/(n-1)*100)+'%');
  if(trDraw.last!==P.tr+cur){trDraw.last=P.tr+cur;const hop=T.seq[cur];const nd=N[hop[0]];
    $('plat_panel').innerHTML=`<div class="dh2">Trace a figure</div><h3 class="plat-h3 big mono">${T.l}</h3>
     <div class="plat-hops">${T.seq.map((s,k)=>`<div class="plat-hop${k<cur?' ok':k===cur?' cur':''}"><i style="--c:${N[s[0]].c}"></i><b>${N[s[0]].l}</b><code>${s[1]}</code></div>`).join('')}</div>
     <div class="plat-now"><span>Now at ${nd.l}</span><b class="mono">${hop[2]}</b></div>
     <button class="btn sm" data-go="${T.go}">Open ${navLabel(T.go)}</button>`;
    $('plat_panel').querySelector('[data-go]').onclick=()=>go(T.go);}}
/* governance strip */
const GOV={'PBB Group':[6,'RM402.6bn'],'Public Bank':[3,'RM321.4bn'],'Public Islamic Bank':[2,'RM66.4bn']};
function govDraw(ent,risk){$('plat_rf').innerHTML=`<code>rf_entity(entity)</code> ${M(GOV[ent][0]+' of 6')} product rows · ${M(GOV[ent][1])}`;
  $('plat_cm').innerHTML=risk?`<code>nric</code> <b class="mono">850612-**-****</b> <span class="plat-ok">partial · audited</span>`:`<code>nric</code> <b class="mono plat-mask">••••••••••••</b> <span class="muted">masked for finance roles</span>`;}

PAGE('platform',{title:'How it works',meta:'8 source systems · 186 governed tables · 3 Genie spaces · 1 supervisor agent',
  sub:'The Databricks platform under every number in this workbench. Click a node, or trace a figure back to source.',
  right:`<button class="btn" id="plat_reset">Reset view</button><button class="btn primary" id="plat_play">▶ Play trace</button>`,
  html:()=>`<div class="plat-bar"><span class="plat-lbl">Trace a figure</span><div id="plat_pt"></div><span class="plat-tip">Particles show data moving; click a node to light its upstream and downstream path.</span></div>
   <div class="g12 plat-g">
    <div><div class="stage plat-stage"><div class="legend2"><span><i style="background:#67e8f9"></i>SOURCE</span><span><i style="background:#60a5fa"></i>INGEST</span><span><i style="background:#f5c451"></i>UNITY CATALOG</span><span><i style="background:#a78bfa"></i>SEMANTIC + ML</span><span><i style="background:#fb923c"></i>AI</span><span><i style="background:#ef4444"></i>APP</span></div><div id="plat_svg"></div></div>
     <div id="plat_tl"></div></div>
    <div class="dpanel plat-panel" id="plat_panel"></div>
   </div>
   <div class="card plat-gov"><div class="plat-gh"><b>Governance</b><span>Same query, different answer by who asks.</span></div>
    <div class="plat-gc"><span class="plat-gl">Row filter by entity</span><div class="seg" id="plat_ent">${Object.keys(GOV).map((e,i)=>`<button class="${i?'':'on'}" data-e="${e}">${e}</button>`).join('')}</div><div class="plat-gv" id="plat_rf"></div></div>
    <div class="plat-gc"><span class="plat-gl">Column mask</span><label class="sw"><input type="checkbox" id="plat_risk"><i></i>Credit Risk, approved purpose</label><div class="plat-gv" id="plat_cm"></div></div>
   </div>`,
  render:()=>{
    platDraw();platIntro();
    P.ptabs=tabs('plat_pt',[{id:'explore',l:'Explore'},{id:'nim',l:'NIM 2.09%'},{id:'cet1',l:'CET1 13.864%'},{id:'opr',l:'25bp NII'}],id=>{
      if(id==='explore'){if(P.tl){P.tl.stop();P.tl.set(0,false);P.tl.status('pick a figure');}if(P.tr){P.tr=null;clearLits();applyHi(null);platIntro();}Object.values(P.nodes).forEach(g=>g.classList.remove('hit'));return;}
      if(P.tr===id&&!P.sel)return;P.sel=null;Object.values(P.nodes).forEach(g=>g.classList.remove('hit'));trSet(id);setTimeout(()=>P.tl.play(),250);},{style:'pill',value:'explore'});
    $('plat_play').onclick=()=>{const k=P.tr||'nim';if(P.tr!==k||P.sel){P.ptabs.set(k);}else{P.tl.set(0);P.tl.play();}};
    $('plat_reset').onclick=()=>{P.sel=null;P.ptabs.set('explore');clearLits();applyHi(null);platIntro();};
    let ent='PBB Group';$('plat_ent').querySelectorAll('button').forEach(b=>b.onclick=()=>{ent=b.dataset.e;$('plat_ent').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));govDraw(ent,$('plat_risk').checked);});
    $('plat_risk').onchange=e=>govDraw(ent,e.target.checked);govDraw(ent,false);
    platStart();setTimeout(()=>P.ptabs.set('nim'),500);
  },
  onShow:()=>platStart(),
  genie:[
   {q:'Where does the NIM figure come from?',a:{agent:'Genie: Finance QA',sub:'Unity Catalog lineage',steps:[['Resolving','metric <code>mv_nim_quarterly.nim_pct</code>'],['Walking column lineage','5 hops to source']],headline:'NIM 2.09% is computed in the metric view from gold interest income and average yielding assets, which trace back to SIBS loan and deposit accounts and the GL.',kc:[['Upstream tables','11'],['Expectations','38 passed','up']],sources:['Unity Catalog lineage',SRC.deck]}},
   {q:'Which pages use MLflow models?',a:{agent:'Genie: Finance QA',steps:[['Reading','workbench page map']],headline:'OPR scenario lab, Customer behaviour, Product dynamics and Data quality monitor call registered MLflow models.',bullets:['<b>deposit_beta v7</b>: OPR scenario lab, Product dynamics.','<b>prepayment_hazard v7</b>: Customer behaviour.','<b>dq_anomaly v3</b>: Data quality monitor.'],sources:['MLflow model registry in Unity Catalog']}},
   {q:'Who can see Public Islamic Bank data?',a:{agent:'Genie: Regulatory Reporting',steps:[['Reading','row filter rf_entity']],headline:'Group finance members see all entities; Bank and Public Islamic Bank users see only their entity through the rf_entity row filter.',sources:['Unity Catalog row filters','system.access.audit']}}]
});
})();

buildNav();
go((location.hash||'#cfo-brief').slice(1).replace(/[^a-z-]/g,'')||'cfo-brief');
