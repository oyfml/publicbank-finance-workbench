.gfc-strip{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:13px 18px;border-top:1px solid var(--line);background:#fff;min-height:62px}
.gfc-sl span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.gfc-sl b{font-size:13px;font-weight:600;white-space:nowrap}.gfc-sl b.mono{font-size:18px}
.gfc-sl .bd{color:var(--crit);font-family:var(--mono)}.gfc-sl .ok{color:var(--teal);font-family:var(--mono)}
.gfc-pills{display:flex;gap:6px}
.gfc-pill{width:40px;height:30px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f1f2f4;color:var(--text-3);font-family:var(--mono);font-size:11px;font-weight:700;line-height:1;transition:background .35s,color .35s,transform .35s;cursor:default}
.gfc-pill small{font-size:8.5px;font-weight:500;opacity:.75;margin-top:2px}
.gfc-pill.fail{background:#fde4e7;color:#be123c}
.gfc-pill.pass{background:#dcf5ec;color:#047857;animation:gfcOk .4s ease}
.gfc-pill.run{background:#fff7e6;color:#b45309;transform:translateY(-2px)}
.gfc-pill.run::before{content:"";width:9px;height:9px;border:2px solid #f3d29a;border-top-color:#d97706;border-radius:50%;animation:spin .6s linear infinite}
@keyframes gfcOk{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
.gfc-prw{margin-left:auto;display:flex;align-items:center;gap:12px}
.gfc-nc{font-size:12px;color:var(--text-3)}.gfc-nc.ok{color:var(--teal);font-family:var(--mono);font-weight:600}.gfc-nc.run{color:#b45309;font-family:var(--mono)}
.gfc-nc.run::after{content:"";display:inline-block;width:8px;height:8px;margin-left:6px;border:2px solid #f3d29a;border-top-color:#d97706;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1px}
.gfc-stp{display:flex;align-items:center;gap:6px;animation:fi .35s ease both}
.gfc-stp .nd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-3)}
.gfc-stp .nd .k{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;background:#fff;transition:.3s}
.gfc-stp .nd.done{color:var(--text)}.gfc-stp .nd.done .k{background:var(--teal);border-color:var(--teal);color:#fff;animation:gfcOk .4s ease}
.gfc-stp .nd.cur{color:var(--text)}.gfc-stp .nd.cur .k{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px rgba(200,16,46,.12)}
.gfc-stp .ln{width:22px;height:2px;background:var(--line-2);border-radius:2px;position:relative;overflow:hidden}
.gfc-stp .ln.on::after{content:"";position:absolute;inset:0;background:var(--teal);animation:gfcLn .5s ease both}
@keyframes gfcLn{from{transform:translateX(-100%)}to{transform:none}}
.gfc-foot{grid-column:1/-1;padding:9px 18px;border-top:1px solid #f2f3f5;background:#fcfcfd}
.btn[disabled]{opacity:.45;cursor:default}
/* ---------- gf-reporting ---------- */
.gfr-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px 18px;min-width:0}
.gfr-ch1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gfr-ch1 .ic{color:var(--brand);font-size:15px}
.gfr-ch1 b{font-size:14.5px;font-weight:600}
.gfr-ch1 .mono{font-size:11.5px}
.gfr-ch1>div:last-child{margin-left:auto}
.gfr-ch1 .ptabs button{padding:5px 12px;font-size:12px}
table.gfr-fh{width:100%;border-collapse:collapse}
.gfr-fh th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;text-align:left;padding:12px 8px 10px;border-bottom:1px solid var(--line)}
.gfr-fh th.n,.gfr-fh td.n{text-align:right}
.gfr-fh th.tr,.gfr-fh td.tr{text-align:right;width:130px}
.gfr-fh td{padding:11px 8px;border-bottom:1px solid #f2f3f5;font-size:13.5px}
.gfr-fh tr:not(:first-child){animation:fi .4s ease both}
.gfr-fh tr:hover td{background:#fbfbfc}
.gfr-fh td.n{font-family:var(--mono);font-size:13px;white-space:nowrap}
.gfr-fh td.n.mut{color:var(--text-3)}
.gfr-fh td.n b{font-weight:600}
.gfr-fh td.n small{font-size:9.5px;color:var(--text-3);margin-right:6px;font-weight:500;letter-spacing:.04em}
.gfr-fh tr.tot td{font-weight:600;border-top:1px solid var(--line-2)}
.gfr-ch{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px}
.gfr-ch.g{background:var(--teal-tint);color:#0b7a6e}.gfr-ch.b{background:var(--brand-tint);color:var(--brand-dark)}
.gfr-sp{display:inline-block;vertical-align:middle;overflow:visible}
.gfr-sp .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:gfrDraw .9s .15s ease forwards}
.gfr-sp .end{opacity:0;animation:fi .3s .9s ease forwards}
@keyframes gfrDraw{to{stroke-dashoffset:0}}
.gfr-flags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.gfr-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:7px;padding:5px 10px;border:1px solid;animation:fi .35s ease both}
.gfr-flag i{width:7px;height:7px;border-radius:50%}
.gfr-flag.w{color:#9a5b05;background:var(--amber-tint);border-color:#f6dfb4}.gfr-flag.w i{background:var(--amber)}
.gfr-flag.g{color:#0b7a6e;background:var(--teal-tint);border-color:#c3ece4}.gfr-flag.g i{background:var(--teal)}
.gfr-cp,.gfr-dp{display:flex;flex-direction:column}
.gfr-go{width:100%;justify-content:center;padding:11px 14px;font-size:13.5px;margin-bottom:12px}
.gfr-hide{display:none}
#gfrRun.gfr-fold{max-height:0;opacity:0;padding:0;margin:0;overflow:hidden;border:0;transition:max-height .5s ease,opacity .4s,padding .4s}
#gfrRun.arun.going{max-height:240px}
ol.gfr-com{list-style:none;margin:6px 0 0;padding:0}
ol.gfr-com li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #f2f3f5;font-size:13px;line-height:1.55;transition:opacity .35s,transform .35s}
ol.gfr-com li.pre{opacity:0;transform:translateY(6px)}
ol.gfr-com li .k{width:20px;height:20px;border-radius:6px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
ol.gfr-com li b{font-weight:600}
.gfr-cite{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.gfr-cite span{font-size:10.5px;font-family:var(--mono);color:var(--text-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.gfr-cite span::before{content:"▤ ";color:var(--brand)}
.gfr-tr{margin-top:auto;padding-top:14px}
.gfr-lg{display:flex;gap:14px;font-size:11.5px;color:var(--text-2)}
.gfr-lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.gfr-lg i.d{background:repeating-linear-gradient(90deg,#c8102e 0 5px,transparent 5px 8px)!important}
.gfr-ch1 .gfr-lg{margin-left:auto}
#gfrMkCap{font-size:11.5px}#gfrMkCap b{color:var(--text);font-weight:600}
#gfrMk{margin-top:6px}
#gfrMk .tick{font-size:10.5px;fill:var(--text-3)}
#gfrMk .evl{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--text)}
#gfrMk .evs{font-family:var(--mono);font-size:9.5px;fill:var(--text-3)}
#gfrMk .gfr-ev{transition:opacity .4s}
#gfrMk .gfr-vl{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:#fff;stroke-width:3px}
#gfrMk .gfr-end{font-family:var(--mono);font-size:11px;font-weight:600;transition:opacity .4s}
#gfrMk .gfr-gp{font-family:var(--mono);font-size:11px;font-weight:700;fill:#fff}
#gfrMk g{transition:opacity .4s}
.gfr-sug{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:10px}
.gfr-sug .chip{text-align:left;cursor:pointer}
.gfr-sug .chip:hover{border-color:var(--brand);color:var(--brand-dark)}
.gfr-in{display:flex;gap:6px;margin-bottom:6px}
.gfr-in input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:12.5px}
#gfrDD{max-height:430px;overflow:auto}
#gfrDD .ai{padding:12px 12px;box-shadow:none}
#gfrDD .ai .hl{font-size:13.5px}
#gfrDD .ai ul.bl{font-size:12.5px}
#gfrDD .msg.u{background:#f3f4f6;border-radius:10px;padding:7px 11px;font-size:12.5px;max-width:90%;width:fit-content}
/* ---------- gf-board ---------- */
.gfb-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gfb-bar .lb{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.gfb-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;user-select:none}
.gfb-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 11px 4px 6px;font-size:12px;color:var(--text-3);cursor:grab;transition:background .2s,border-color .2s,color .2s,box-shadow .2s;touch-action:none}
.gfb-chip .hd{font-style:normal;color:#c4c9d1;letter-spacing:-2px;font-size:10px}
.gfb-chip .ck{font-style:normal;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:#eef0f3;color:var(--text-3)}
.gfb-chip.on{color:var(--text);border-color:#e9c7cd;background:var(--brand-soft)}
.gfb-chip.on .ck{background:var(--brand);color:#fff}
.gfb-chip:not(.on){text-decoration:line-through;text-decoration-color:#c4c9d1}
.gfb-chip.drag{position:relative;z-index:20;cursor:grabbing;box-shadow:0 10px 24px rgba(16,24,40,.18);transition:none}
.gfb-slot{display:inline-block;height:26px;border:1.5px dashed var(--brand);border-radius:999px;background:var(--brand-tint)}
.gfb-cnt{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.gfb-hero{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 20px 14px;background-image:radial-gradient(#eceef2 1px,transparent 1px);background-size:18px 18px}
.gfb-ths{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px}
.gfb-th{flex:0 0 128px;width:128px;min-width:0;cursor:default}
.gfb-th .pp{height:172px;border-radius:7px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(16,24,40,.06);padding:12px 10px 10px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.gfb-th.ghost .pp{border:1.5px dashed #d6d9df;background:rgba(255,255,255,.75);box-shadow:none;display:grid;place-items:center;text-align:center}
.gfb-th.ghost .gl{font-size:11px;color:var(--text-3);padding:0 8px;line-height:1.4}
.gfb-th.gen{cursor:pointer}
.gfb-th.gen:hover .pp{transform:translateY(-3px);box-shadow:0 10px 22px rgba(16,24,40,.12)}
.gfb-th.on .pp{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.14),0 8px 18px rgba(16,24,40,.1)}
.gfb-th .pp .hb{display:block;height:4px;width:34px;border-radius:2px;background:var(--brand);margin-bottom:7px}
.gfb-th .pp b{display:block;font-size:10px;font-weight:600;line-height:1.25;height:25px;overflow:hidden}
.gfb-th .pk{display:flex;gap:4px;margin:6px 0}
.gfb-th .pk span{flex:1;font-family:var(--mono);font-size:8px;font-weight:600;background:#f6f7f9;border-radius:3px;padding:3px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfb-th .mc{margin:6px 0 8px}
.gfb-th .ln{display:block;height:3px;border-radius:2px;background:#eceef2;margin-top:5px;width:var(--w)}
.gfb-th .cap{display:flex;gap:6px;font-size:11px;color:var(--text-2);margin-top:7px;line-height:1.3}
.gfb-th .cap span{font-family:var(--mono);color:var(--text-3)}
.gfb-th.on .cap{color:var(--brand-dark)}
.gfb-th.fly .pp{animation:gfbFly .6s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes gfbFly{0%{opacity:0;transform:translate(70px,-40px) rotate(8deg) scale(.7)}100%{opacity:1;transform:none}}
.gfb-th.fly .ln{animation:gfbFill .5s ease both}.gfb-th.fly .ln:nth-of-type(2){animation-delay:.42s}.gfb-th.fly .ln:nth-of-type(3){animation-delay:.5s}.gfb-th.fly .ln:nth-of-type(4){animation-delay:.58s}
.gfb-th.fly .pk,.gfb-th.fly .mc,.gfb-th.fly b{animation:fi .4s .3s ease both}
@keyframes gfbFill{from{width:0}}
.gfb-none{color:var(--text-3);font-size:12.5px;padding:60px 0;text-align:center;width:100%}
.gfb-pvw{min-width:0}
.gfb-pvh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gfb-pvh b{font-size:13.5px;font-weight:600}.gfb-pvh .mut{font-size:12px;margin-right:auto}
.gfb-page{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.06);padding:22px 28px 16px;position:relative}
.gfb-page.in{animation:gfbIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes gfbIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.gfb-page .ph3{display:flex;gap:12px;font-size:11px;color:var(--text-3);border-bottom:2px solid var(--brand);padding-bottom:8px;margin-bottom:14px}
.gfb-page .ph3 b{color:var(--brand)}.gfb-page .ph3 .r{margin-left:auto;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;font-size:10px}
.gfb-page .pt{display:flex;gap:14px;align-items:flex-start}
.gfb-page .pt .no{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--brand);line-height:1;margin-top:2px}
.gfb-page h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.gfb-page .pt p{margin:3px 0 0;color:var(--text-2);font-size:13px}
.gfb-page .pk4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 4px}
.gfb-page .pk4>div{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.gfb-page .pk4 b{display:block;font-family:var(--mono);font-size:16px;font-weight:600}
.gfb-page .pk4 span:not(.gfb-n){font-size:11px;color:var(--text-3)}
.gfb-page .pc{margin-top:12px}
.gfb-page .ct{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:4px}
.gfb-page ul.pb{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--text-2)}
.gfb-page .pf{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);border-top:1px solid #f2f3f5;margin-top:14px;padding-top:8px;font-family:var(--mono)}
.gfb-n{border-bottom:1.5px dotted rgba(200,16,46,.55);cursor:help;border-radius:3px;transition:background .15s;padding:0 1px}
.gfb-n:hover{background:var(--brand-tint);color:var(--brand-dark)}
.gfb-page.sk .skl{display:block;height:11px;border-radius:5px;margin-top:9px;background:linear-gradient(90deg,#f1f2f4 25%,#f8f9fa 37%,#f1f2f4 63%);background-size:400% 100%;animation:sk 1.4s ease infinite}
.gfb-page.sk{min-height:440px}
.gfb-hint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;font-size:12.5px;color:var(--text-2);box-shadow:0 8px 24px rgba(16,24,40,.08);white-space:nowrap}
.gfb-side .arun{text-align:left}
.gfb-side .statgrid:empty{display:none}
.gfb-side .statgrid div{animation:fi .35s ease both}
.gfb-aps{display:flex;align-items:flex-start;gap:4px;margin:4px 0 12px}
.gfb-aps .st{display:flex;flex-direction:column;align-items:center;text-align:center;width:84px;flex:none}
.gfb-aps .st .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;color:var(--text-3);background:#fff;transition:.3s}
.gfb-aps .st b{font-size:12px;font-weight:600;margin-top:6px;color:var(--text-3)}
.gfb-aps .st small{font-size:10.5px;color:var(--text-3);line-height:1.3;margin-top:1px}
.gfb-aps .st.done .k{background:var(--teal);border-color:var(--teal);color:#fff;animation:gfcOk .45s ease}
.gfb-aps .st.done b,.gfb-aps .st.cur b{color:var(--text)}
.gfb-aps .st.cur .k{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px rgba(200,16,46,.1)}
.gfb-aps .ln{flex:1;height:2px;background:var(--line-2);margin-top:14px;border-radius:2px;position:relative;overflow:hidden}
.gfb-aps .ln.on::after{content:"";position:absolute;inset:0;background:var(--teal);animation:gfcLn .6s ease both}
.gfb-apb{width:100%;justify-content:center}
.gfb-lin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gfb-lin .nd{border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;font-family:var(--mono);font-size:11.5px;background:#fff}
.gfb-lin .nd span{display:block;font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:2px}
.gfb-lin .nd.hl{border-color:#f0b5bf;background:var(--brand-soft)}
.gfb-lin .ar{width:18px;height:2px;background:var(--line-2);position:relative}
.gfb-lin .ar::after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid var(--line-2);border-top:4px solid transparent;border-bottom:4px solid transparent}
/* ================= 60_qa: qa-monitor, qa-trace, qa-ecl ================= */
.qa-live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;background:#fff}
.qa-live.mono{font-family:var(--mono);font-size:11.5px}
.qa-gate{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px 5px 10px;font-size:12px;border:1px solid var(--line-2);background:#fff;cursor:pointer;color:var(--text-2);transition:background .35s,border-color .35s,color .35s}
.qa-gate i{width:8px;height:8px;border-radius:50%;background:#d98a0b;animation:pulse 1.4s ease-in-out infinite}
.qa-gate b{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;font-weight:700}
.qa-gate em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.qa-gate.scan{background:var(--amber-tint);border-color:#f3dcae}.qa-gate.scan b{color:#a16207}
.qa-gate.blocked{background:var(--brand-tint);border-color:#f6c9d0}.qa-gate.blocked i{background:var(--brand)}.qa-gate.blocked b{color:var(--brand-dark)}
.qa-gate.ready{background:var(--teal-tint);border-color:#bfe8e1}.qa-gate.ready i{background:var(--teal);animation:none}.qa-gate.ready b{color:#0b7a6e}
.qa-gate.released{background:#0f9f8f;border-color:#0f9f8f;color:#e7f7f4}.qa-gate.released i{background:#fff;animation:none}.qa-gate.released b{color:#fff}.qa-gate.released em{color:#c9efe9}
.qa-gate.pop{animation:qaPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes qaPop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:none}}
/* monitor layout */
.qa-mon{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.qa-side{display:flex;flex-direction:column;gap:14px}
.qa-side .card{padding:16px 18px}
.qa-lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-3);margin-bottom:10px}
.qa-big{font-size:54px;font-weight:600;letter-spacing:-.04em;line-height:1}
.qa-bs{font-size:12.5px;color:var(--text-2);margin-top:6px}
.qa-bs2{font-size:12px;color:var(--text-3);margin-top:6px}.qa-up{color:var(--brand);font-weight:600;font-family:var(--mono)}
.qa-bars{display:flex;align-items:flex-end;gap:3px;height:48px;margin-top:14px}
.qa-bars i{flex:1;background:#f2b5bf;border-radius:2px 2px 0 0}
.qa-bars i.now{background:var(--brand)}
.qa-pcs,.qa-sps{display:flex;flex-wrap:wrap;gap:6px}
.qa-pc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;transition:.15s}
.qa-pc i{width:6px;height:6px;border-radius:50%}
.qa-pc span{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.qa-pc:hover{border-color:#cfd3da}
.qa-pc.on{background:var(--brand);border-color:var(--brand);color:#fff}.qa-pc.on span{color:#ffd5db}
.qa-sp{border:1px solid;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;background:#fff;transition:.15s}
.qa-sp.dq{color:#b4232f;border-color:#f6c9d0;background:#fff7f8}.qa-sp.bz{color:#0b7a6e;border-color:#bfe8e1;background:#f3fbf9}.qa-sp.dn{color:var(--text-2);border-color:var(--line-2)}
.qa-sp.on{box-shadow:0 0 0 2px currentColor inset}
.qa-gr{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--text-2)}
.qa-gr i{width:6px;height:6px;border-radius:50%;flex:none}
.qa-gr b{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--text)}
.qa-gsep{height:1px;background:var(--line);margin:6px 0}
.qa-side .trace{margin-top:-2px}
.qa-fh{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.qa-fh b{font-size:14.5px;font-weight:600;flex:1}
.qa-fi{color:var(--brand);display:grid}
.qa-fs{font-size:12px;color:var(--text-3)}
.qa-dd{font-size:12px;border:1px solid var(--line-2);border-radius:7px;padding:4px 10px;background:#fff}
.qa-dd::after{content:" ⌄";color:var(--text-3)}
.qa-feedc{padding:0!important;overflow:hidden}
.qa-fg{display:flex;align-items:center;gap:12px;padding:11px 18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-3);border-bottom:1px solid var(--line);background:#fcfcfd}
.qa-fg i{flex:1;height:1px;background:var(--line)}
.qa-row{position:relative;border-bottom:1px solid #f1f2f5;transition:background .3s}
.qa-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#cbd5e1;transition:background .3s}
.qa-row.dq::before{background:var(--brand)}.qa-row.bz::before{background:var(--teal)}
.qa-row.done .qa-rt{color:var(--text-2)}
.qa-row.qa-new{animation:qaIn .6s cubic-bezier(.2,.8,.2,1) both}
.qa-row.qa-new .qa-rh{animation:qaFlash 1.8s ease both}
@keyframes qaIn{from{opacity:0;transform:translateY(-14px);max-height:0}to{opacity:1;transform:none;max-height:120px}}
@keyframes qaFlash{0%,30%{background:#fff1f3}100%{background:transparent}}
.qa-rh{display:grid;grid-template-columns:62px 34px minmax(0,1fr) 20px;gap:14px;align-items:start;padding:14px 18px 14px 20px;cursor:pointer}
.qa-rh:hover{background:#fafafb}
.qa-row.open .qa-rh{background:#fcfcfd}
.qa-tm{font-family:var(--mono);font-size:12px;color:var(--text);padding-top:2px}
.qa-tm span{display:block;font-size:9.5px;color:var(--text-3);margin-top:3px}
.qa-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.qa-rt{font-size:13.5px;line-height:1.45;color:var(--text)}
.qa-rt b{font-weight:600}
.qa-rt em{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:600}
.qa-rt em.r{color:var(--brand)}.qa-rt em.g{color:#0b7a6e}
.qa-rc{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.qa-st,.qa-mc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:5px;padding:2px 8px;border:1px solid var(--line-2);background:#fff;color:var(--text-2);white-space:nowrap}
.qa-mc{font-family:var(--mono);font-size:11px}
.qa-mc svg{width:12px;height:12px;opacity:.6}
.qa-st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.qa-st.dq{color:#b4232f;border-color:#f6c9d0;background:#fff7f8}.qa-st.bz{color:#0b7a6e;border-color:#bfe8e1;background:#f3fbf9}.qa-st.done{color:var(--text-2);background:#f6f7f9}.qa-st.done::before{display:none}
.qa-chev{color:var(--text-3);padding-top:4px;transition:transform .25s}
.qa-row.open .qa-chev{transform:rotate(90deg);color:var(--brand)}
.qa-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qa-row.open .qa-x{grid-template-rows:1fr}
.qa-xw{overflow:hidden}
.qa-xin{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:4px 18px 18px 96px}
.qa-xch{border:1px solid var(--line);border-radius:10px;padding:12px 12px 4px}
.qa-xhd{display:flex;align-items:baseline;gap:10px;white-space:nowrap;font-size:12px;color:var(--text-3);margin-bottom:4px}
.qa-xhd b{color:var(--text);font-size:13px;font-weight:600}
.qa-xlg{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:6px;font-size:11px}
.qa-xlg i{display:inline-block;width:12px;height:3px;border-radius:2px;background:#334155}.qa-xlg i.b{height:8px;background:#e8edf5;margin-left:6px}
.qa-tk{font-family:var(--mono);font-size:10px;fill:#9aa1ab}
.qa-fl{font-family:var(--mono);font-size:10.5px;font-weight:600}
.qa-fp .qa-ring{transform-box:fill-box;transform-origin:center;animation:qaRing 1.6s ease-out infinite}
.qa-fp.late{opacity:0;animation:fi .3s ease .9s both}
@keyframes qaRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.4);opacity:0}}
.qa-xv{display:flex;flex-direction:column;gap:8px}
.qa-xvh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.qa-av{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-size:12px;flex:none}
.qa-av.fx{background:#0f172a}
.qa-vp{margin-left:auto;font-size:11.5px;border-radius:999px;padding:3px 10px;font-weight:600}
.qa-vp b{font-family:var(--mono);margin-left:3px}
.qa-vp.dq{background:var(--brand-tint);color:var(--brand-dark)}.qa-vp.bz{background:var(--teal-tint);color:#0b7a6e}.qa-vp.ok{background:var(--teal-tint);color:#0b7a6e}
.qa-xv p{margin:0;font-size:13px;line-height:1.5;color:var(--text-2)}
.qa-ck{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qa-ck li{display:grid;grid-template-columns:16px 112px minmax(0,1fr);gap:8px;align-items:start;font-size:12px;line-height:1.4}
.qa-ck li b{font-weight:600;font-size:11.5px}
.qa-ck li span{color:var(--text-2)}
.qa-ck li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:9px;color:#fff;font-weight:700}
.qa-ck li.w{opacity:.25}
.qa-ck li.run i{border-top-color:var(--brand);animation:spin .7s linear infinite}
.qa-ck li.ok i{background:var(--teal);border-color:var(--teal)}.qa-ck li.ok i::after{content:"✓"}
.qa-ck li.bad i{background:var(--brand);border-color:var(--brand)}.qa-ck li.bad i::after{content:"!"}
.qa-ck li.ok,.qa-ck li.bad{animation:fi .25s ease both}
.qa-xa{display:flex;align-items:center;gap:8px;margin-top:6px}
.qa-xa .btn{white-space:nowrap}.qa-xa .btn[disabled]{opacity:.5;cursor:default}
.qa-own{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.qa-empty{padding:30px;text-align:center;color:var(--text-3);font-size:13px}
/* trace */
.qa-bar{display:flex;align-items:center;gap:12px;padding:12px 14px!important;margin-bottom:14px}
.qa-cases{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.qa-cases button{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:11.5px;color:var(--text-2);cursor:pointer}
.qa-cases button:hover{border-color:#cfd3da;color:var(--text)}
.qa-cases button.on{background:#0d1020;border-color:#0d1020;color:#fff}
.qa-stage{min-height:430px}
.qa-sttl{position:absolute;left:18px;top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:#7d8396}
.qa-sttl b{color:#e6e8ef;font-weight:600}
svg.qa-lg{display:block}
.qa-lg .qa-ch{font-family:var(--mono);font-size:10px;letter-spacing:.12em;fill:#5d6479}
.qa-e{fill:none;stroke:rgba(148,163,184,.22);stroke-width:1.2}
.qa-e.dim{stroke:rgba(148,163,184,.1)}
.qa-e.trace{stroke:rgba(34,211,238,.35)}
.qa-e.aff{stroke:rgba(245,158,11,.55);stroke-width:1.6;stroke-dasharray:4 4}
.qa-e.fix{stroke:rgba(45,212,191,.6);stroke-width:1.8}
.qa-o{fill:none;stroke:#22d3ee;stroke-width:2.6;stroke-linecap:round}
.qa-o.fixd{stroke:#2dd4bf}
.qa-hd{fill:#cffafe;transition:opacity .2s}
.qa-nb{fill:#131830;stroke:rgba(255,255,255,.13);stroke-width:1.2}
.qa-nt{fill:#64748b}
.qa-n1{font-family:var(--mono);font-size:11px;fill:#e6e8ef!important;font-weight:500}
.qa-n2{font-family:Inter,sans-serif!important;font-size:10px;fill:#7d8396!important}
.qa-nm{font-family:var(--mono);font-size:11px;font-weight:700;fill:#fff!important}
.qa-halo{fill:none;opacity:0}
.qa-nd{cursor:default}
.qa-nd.dim{opacity:.38}
.qa-nd.start .qa-nb{stroke:#fff;stroke-width:1.6}.qa-nd.start .qa-nt{fill:#fff}
.qa-nd.trace .qa-nb{stroke:#22d3ee;fill:#10233a;filter:url(#qaGlow)}.qa-nd.trace .qa-nt{fill:#22d3ee}.qa-nd.trace .qa-nm{fill:#67e8f9!important}
.qa-nd.bad .qa-nb{stroke:#ef4444;stroke-width:1.8;fill:#2a1220;filter:url(#qaGlow)}.qa-nd.bad .qa-nt{fill:#ef4444}.qa-nd.bad .qa-nm{fill:#fca5a5!important}
.qa-nd.bad .qa-halo{fill:#ef4444;transform-box:fill-box;transform-origin:center;animation:qaHalo 1.5s ease-out infinite}
@keyframes qaHalo{0%{transform:scale(1);opacity:.7}100%{transform:scale(4.2);opacity:0}}
.qa-nd.aff .qa-nb{stroke:rgba(245,158,11,.75);fill:#241c14}.qa-nd.aff .qa-nt{fill:#f59e0b}.qa-nd.aff .qa-nm{fill:#fcd34d!important}
.qa-nd.queue .qa-nb{stroke:rgba(255,255,255,.35);stroke-dasharray:4 3}.qa-nd.queue .qa-nt{fill:#94a3b8;animation:pulse .8s infinite}
.qa-nd.fixed .qa-nb{stroke:#2dd4bf;fill:#0f2a2a;filter:url(#qaGlow)}.qa-nd.fixed .qa-nt{fill:#2dd4bf}.qa-nd.fixed .qa-nm{fill:#5eead4!important}
#qtTl.qa-ok .th b{color:#5eead4}
#qtTl.qa-ok .fillb{background:linear-gradient(90deg,#22d3ee,#2dd4bf)}
.qa-two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.qa-two .card{min-height:250px}
.qa-ch2{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qa-ch2 b{font-size:14px;font-weight:600}
.qa-cf{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.qa-ph{border:1px dashed var(--line-2);border-radius:10px;padding:26px;text-align:center;color:var(--text-3);font-style:italic;font-size:12.5px}
.qa-hl{list-style:none;margin:0;padding:0}
.qa-hl li{display:grid;grid-template-columns:20px 58px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid #f2f3f5;font-size:12.5px;animation:fi .3s ease both}
.qa-hl li span{width:18px;height:18px;border-radius:50%;background:#e0f7fb;color:#0e7490;font-family:var(--mono);font-size:10px;display:grid;place-items:center;font-weight:700}
.qa-hl li b{font-weight:600}.qa-hl li em{font-style:normal;color:var(--text-2)}
.qa-hl li.bad span{background:var(--brand);color:#fff}.qa-hl li.bad em{color:var(--brand-dark);font-weight:500}
.qa-nar{margin:0;border-left:3px solid var(--brand);padding:2px 0 2px 14px;font-style:italic;color:#1f2937;font-size:13.5px;line-height:1.6}
.qa-facts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.qa-facts span{font-family:var(--mono);font-size:11px;border:1px solid #f6c9d0;background:#fff7f8;color:#9f1c2b;border-radius:5px;padding:2px 8px}
.qa-sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:14px 0 6px}
.qa-sub code{text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:11px;color:var(--text-2)}
.qa-code{margin:0;background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:8px 0;font-family:var(--mono);font-size:11.5px;line-height:1.65;overflow:auto;color:#334155}
.qa-code>span{display:block;padding:0 12px;border-left:3px solid transparent;white-space:pre}
.qa-code>span.bad{background:#fdecee;border-left-color:var(--brand);color:#7f1d1d}
.qa-code .k{color:#7c3aed}.qa-code .s{color:#0f766e}.qa-code .c{color:#9aa1ab}
.qa-diff{border:1px solid var(--line);border-radius:9px;overflow:hidden;font-family:var(--mono);font-size:11.5px;line-height:1.7}
.qa-diff div{padding:1px 12px;white-space:pre-wrap;word-break:break-word}
.qa-diff div i{font-style:normal;display:inline-block;width:14px;opacity:.7}
.qa-diff .m{background:#fdecee;color:#9f1239}.qa-diff .p{background:#e9f8f4;color:#065f46}
.qa-res{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:0;margin-top:12px;font-family:var(--mono)}
.qa-res:empty{display:none}
.qa-res span{font-size:20px;font-weight:600;animation:fi .4s ease both}
.qa-res .bad{color:var(--text-3);text-decoration:line-through;font-size:16px}.qa-res .good{color:#0b7a6e}.qa-res .arr{color:var(--text-3);font-size:16px}
.qa-res em{font-style:normal;font-size:11.5px;color:var(--text-3);font-family:Inter,sans-serif}
.qa-fa{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.qa-fa .btn[disabled]{opacity:.55;cursor:default}
/* ecl */
.qa-ask{padding:14px 16px!important;margin-bottom:14px}
.qa-in{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:6px 6px 6px 10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.qa-in:focus-within{border-color:#e7a3ae;box-shadow:0 0 0 3px rgba(200,16,46,.08)}
.qa-in input{flex:1;border:0;outline:none;font-size:14px;background:transparent;padding:6px 0}
.qa-ask .chips{margin:10px 0 0}
.qa-done{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin:2px 0 10px}
.qa-done .ok{width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:9px}
.qa-head{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.45;margin:0 0 14px;max-width:980px;min-height:25px}
.qa-hero{padding:16px 18px 10px!important;margin-bottom:16px}
.qa-hh{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.qa-hh b{display:block;font-size:14px;font-weight:600}
.qa-hh span{font-size:12px;color:var(--text-3)}
.qa-skg{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--text-2)}
.qa-skg span,.qa-skg i{display:inline-flex;align-items:center}
.qa-skg i{width:9px;height:9px;border-radius:3px;margin-right:6px}
svg.qa-sk{display:block}
.qa-skh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;fill:#9aa1ab}
.qa-skl{font-size:12.5px;font-weight:600;fill:#0a0a0a}
.qa-skv{font-family:var(--mono);font-size:10.5px;fill:#6b7280}
.qa-skf{font-family:var(--mono);font-size:11px;font-weight:700;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3px;stroke-linejoin:round;letter-spacing:.01em}
.qa-rib{transition:opacity .25s;cursor:default}
.qa-skn{animation:qaFade .5s ease both}.qa-skn.hide{animation:none;opacity:0}@keyframes qaFade{from{opacity:0}to{opacity:1}}
.qa-ew{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
.qa-sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}.qa-sw.r{background:#c8102e}.qa-sw.g{background:#0f9f8f}
.qa-wl{font-family:var(--mono);font-size:10.5px;font-weight:600;fill:#0a0a0a}.qa-wl.dim{fill:#9aa1ab}
.qa-comm p{margin:0;font-size:13.5px;line-height:1.65;color:#1f2937}
@media (max-width:1250px){.qa-xin{grid-template-columns:1fr;padding-left:20px}.qa-ew,.qa-two{grid-template-columns:1fr}}
#qtK{margin-top:16px}
/* ===== Ask Finance (ask-) ===== */
.ask-g{align-items:start}
.ask-conv{padding:0;display:flex;flex-direction:column;height:calc(100vh - 205px);min-height:600px;overflow:hidden;background:#fff}
.ask-col{max-width:780px;margin:0 auto;padding:0 28px}
.ask-scroll{flex:1;overflow:auto;padding:26px 0 10px;scroll-behavior:auto}
.ask-hello{text-align:center;padding:10px 0 22px}
.ask-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e11d48,#a50d26);color:#fff;display:inline-grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(200,16,46,.25)}
.ask-hello h2{margin:12px 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.ask-hello p{margin:0;color:var(--text-2);font-size:13px}
.ask-turn{margin:18px 0 26px;animation:fi .3s ease both}
.ask-u{display:flex;justify-content:flex-end}
.ask-u span{background:#f3f4f6;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13.5px;max-width:80%;line-height:1.45}
.ask-a{margin-top:14px}
.ask-ah{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.ask-ah b{font-weight:600}
.ask-ah span:last-child{color:var(--text-3);font-family:var(--mono);font-size:11px}
.ask-av{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.ask-a .arun{padding:8px 12px;max-height:300px;overflow:hidden;transition:max-height .45s ease,opacity .3s,padding .3s,margin .3s}
.ask-a .arun .st{padding:4px 0}
.ask-a .arun.ask-fold{max-height:0;opacity:0;padding:0 12px;border-width:0}
.ask-sum{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-3);margin-bottom:4px}
.ask-sum[hidden]{display:none}
.ask-sum button{border:0;background:none;color:var(--brand-dark);font:inherit;cursor:pointer;padding:0}
.ask-ok{width:14px;height:14px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:9px}
.ask-hl{font-size:15.5px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin:6px 0 8px}
.ask-rest{animation:fi .35s ease both}
.ask-bl{margin:0 0 10px;padding-left:18px;font-size:13.5px;line-height:1.6;color:var(--text-2)}
.ask-bl li{margin:2px 0}
.ask-bl b{color:var(--text);font-weight:600}
.ask-ch{border:1px solid var(--line);border-radius:12px;padding:12px 14px 6px;margin:4px 0 10px}
.ask-actn{margin:0 0 10px}
.ask-foot{border-top:1px solid var(--line);padding:12px 0 14px;background:linear-gradient(180deg,#fff,#fcfcfd)}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ask-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.ask-chip i{width:6px;height:6px;border-radius:50%}
.ask-chip:hover{border-color:#e3b3bb;background:var(--brand-soft);transform:translateY(-1px)}
.ask-box{position:relative;border:1px solid var(--line-2);border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(16,24,40,.05);transition:border-color .15s,box-shadow .15s}
.ask-box:focus-within{border-color:#e3a2ad;box-shadow:0 0 0 4px rgba(200,16,46,.07)}
.ask-box textarea{width:100%;border:0;outline:none;resize:none;background:transparent;padding:13px 60px 13px 16px;font-size:14px;line-height:1.45;display:block}
.ask-send{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:10px;border:0;background:var(--brand);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.ask-send:hover{background:var(--brand-dark)}
.ask-cap{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:11px;color:var(--text-3)}
.ask-cap span{display:flex;align-items:center;gap:5px}
.ask-cap i{width:6px;height:6px;border-radius:50%}
/* activity panel */
.ask-act{position:sticky;top:0}
.ask-live{margin-left:auto;display:flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-family:var(--mono);font-weight:500;color:var(--teal)}
.ask-live i{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
.ask-sup{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfcfd}
.ask-sup b{display:block;font-size:13px}.ask-sup div span{font-size:11px;color:var(--text-3)}
.ask-sup.go{animation:askGlow .9s ease}
@keyframes askGlow{30%{border-color:var(--brand);box-shadow:0 0 0 4px rgba(200,16,46,.08)}}
.ask-agents{margin:0 0 0 20px;border-left:1.5px solid var(--line-2);padding:4px 0 0}
.ask-ag{position:relative;display:flex;align-items:center;gap:9px;margin:8px 0 0 16px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;transition:border-color .3s,background .3s,opacity .3s;opacity:.55}
.ask-ln{position:absolute;left:-17px;top:50%;width:16px;height:1.5px;background:var(--line-2);overflow:hidden}
.ask-ag.on .ask-ln{background:var(--brand)}
.ask-ag.on{opacity:1;border-color:#efb8c1;background:var(--brand-soft)}
.ask-ag.on:not(.done) .ask-ai{animation:askPing 1s ease-in-out infinite}
.ask-ag.done{border-color:#cfeee8;background:#f6fcfb}
.ask-ag.done em{color:var(--teal)}
.ask-ai{width:24px;height:24px;border-radius:7px;background:#f1f2f4;color:var(--text-2);font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.ask-ag.on .ask-ai{background:var(--brand);color:#fff}.ask-ag.done .ask-ai{background:var(--teal)}
@keyframes askPing{50%{box-shadow:0 0 0 5px rgba(200,16,46,.15)}}
.ask-ag div{flex:1;min-width:0}.ask-ag b{display:block;font-size:12.5px;font-weight:600}.ask-ag div span{font-size:10.5px;color:var(--text-3)}
.ask-ag em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.ask-ag.on em{color:var(--brand-dark)}
.ask-why{font-size:12px;color:var(--text-2);line-height:1.5;margin:14px 0 8px}
.ask-confr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.ask-bar{flex:1;height:5px;border-radius:99px;background:#eef0f3;overflow:hidden}
.ask-bar i{display:block;height:100%;background:linear-gradient(90deg,#e8798a,var(--brand));border-radius:99px;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.ask-confr b{font-size:11.5px;color:var(--text)}
.ask-sec{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:16px 0 8px}
.ask-tbs{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.ask-tb{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:3px 7px;background:#fff;color:var(--text-2);animation:fi .35s ease both}
.ask-act .statgrid{margin-top:16px}

/* ===== How it works (plat-) ===== */
.plat-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.plat-lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.plat-tip{margin-left:auto;font-size:12px;color:var(--text-3)}
.plat-g{align-items:start}
.plat-stage{padding:44px 10px 6px;min-height:420px}
.plat-svg{display:block;cursor:default}
.plat-svg .plat-uc{fill:rgba(245,196,81,.035);stroke:rgba(245,196,81,.35);stroke-dasharray:4 4}
.plat-svg .plat-ucl,.plat-svg .plat-col{font-size:9.5px;letter-spacing:.12em;fill:#8d93a8}
.plat-svg .plat-e{transition:opacity .35s}
.plat-svg .plat-e.dim{opacity:.12}
.plat-svg .plat-lit{pointer-events:none}
.plat-svg .plat-pt{transition:fill-opacity .3s}
.plat-svg .plat-pt.dim{visibility:hidden}
.plat-svg .plat-n{cursor:pointer;transition:opacity .35s}
.plat-svg .plat-n.dim{opacity:.18}
.plat-svg .plat-n:hover .plat-ring{opacity:.3}
.plat-svg .plat-n.sel .plat-ring,.plat-svg .plat-n.hit .plat-ring{opacity:.38;animation:platPing 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes platPing{50%{transform:scale(1.35);opacity:.12}}
.plat-svg .plat-halo{animation:platHalo 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes platHalo{50%{transform:scale(1.15);opacity:.7}}
.plat-svg .plat-t{font-size:10px;font-weight:700;fill:#e6e8ef;pointer-events:none}
.plat-svg .plat-t.w{fill:#fff;font-size:11px}
.plat-svg .plat-l{font-size:10.5px;fill:#d7dae3;letter-spacing:.04em;pointer-events:none}
.plat-svg .plat-s{font-size:9.5px;fill:#7d8396;pointer-events:none}
.plat-svg .plat-n.hit .plat-l,.plat-svg .plat-n.sel .plat-l{fill:#fff}
#plat_tl{margin-top:12px}
#plat_tl .stops div{white-space:nowrap}
.plat-panel{min-height:420px}
.plat-panel.fl{animation:fi .3s ease both}
.plat-h3{margin:2px 0 6px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.plat-h3 i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.04)}
.plat-h3.big{font-size:22px}
.plat-p{font-size:13px;color:var(--text-2);line-height:1.55;margin:0 0 12px}
.plat-hint{font-size:12px;color:var(--text-3);margin:12px 0 0}
.plat-sec{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:14px 0 7px}
.plat-chips{display:flex;flex-wrap:wrap;gap:6px}
.plat-objs{display:flex;flex-direction:column;gap:5px}
.plat-objs code,.plat-hop code{font-family:var(--mono);font-size:11px;background:#f4f5f7;border-radius:5px;padding:2px 7px;color:var(--text-2);align-self:flex-start}
.plat-panel .statgrid{margin:14px 0 12px}
.plat-hops{margin:10px 0 12px}
.plat-hop{display:grid;grid-template-columns:14px 92px 1fr;align-items:center;gap:8px;padding:5px 0;font-size:12px;opacity:.4;transition:opacity .25s}
.plat-hop i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);box-sizing:border-box}
.plat-hop.ok,.plat-hop.cur{opacity:1}
.plat-hop.ok i{background:var(--c)}
.plat-hop.cur i{background:var(--c);box-shadow:0 0 0 4px rgba(200,16,46,.12)}
.plat-hop.cur b{color:var(--brand-dark)}
.plat-hop b{font-weight:600}
.plat-hop code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.plat-now{border:1px solid #f3d3d8;background:var(--brand-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.plat-now span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-dark);font-weight:600}
.plat-now b{font-size:15px;font-weight:600}
.plat-gov{display:grid;grid-template-columns:200px 1fr 1fr;gap:22px;align-items:center;margin-top:16px;padding:14px 20px}
.plat-gh b{display:block;font-size:14px;font-weight:600}.plat-gh span{font-size:12px;color:var(--text-3)}
.plat-gc{display:flex;flex-direction:column;gap:7px;border-left:1px solid var(--line);padding-left:22px}
.plat-gl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.plat-gc .seg{align-self:flex-start}
.plat-gv{font-size:12.5px;color:var(--text-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;animation:fi .3s ease both}
.plat-gv code{font-family:var(--mono);font-size:11px;background:#f4f5f7;border-radius:5px;padding:1px 6px}
.plat-mask{letter-spacing:.1em;color:var(--text-3)}
.plat-ok{font-size:11px;color:var(--teal);font-weight:600}
.ask-ag.done em{color:var(--teal)}

</style>
</head>

<script>
const C={s1:'#2a78d6',s2:'#eb6834',s3:'#1baf7a',s4:'#eda100',s5:'#e87ba4',s6:'#008300',s7:'#6250d6',s8:'#e34948',grid:'#ebe9e4',axis:'#c9c7c1',t2:'#52514e',t3:'#8a8984',tot:'#52514e'};
const SEQ=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(parent,x,y,s,attrs={}){const t=el('text',Object.assign({x,y},attrs),parent);t.textContent=s;return t;}
function mk(id,height){const host=typeof id==='string'?$(id):id;host.innerHTML='';const w=Math.max(300,host.clientWidth||600);const s=el('svg',{viewBox:`0 0 ${w} ${height}`,width:w,height});host.appendChild(s);return {s,w,h:height};}
function ticks(min,max,n=5){if(min===max){max=min+1}const span=max-min;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const out=[];for(let v=lo;v<=hi+step/1e6;v+=step)out.push(+v.toFixed(8));return out;}
function rpath(x,y0,y1,w){ // bar from baseline y0 to value y1, rounded at the data end
  const up=y1<y0;const hgt=Math.abs(y1-y0);const r=Math.min(4,hgt/2,w/2);
  if(hgt<0.5)return `M${x},${y0}h${w}`;
  if(up)return `M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`;
  return `M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;}
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.textContent=t.getAttribute('data-tip');tip.style.opacity=1;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px';}else if(!window.__xhair){tip.style.opacity=0;}});
function showTip(e,s){tip.textContent=s;tip.style.opacity=1;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY+14)+'px';}
function wrapLabel(g,x,y,label,max=13){const words=String(label).split(' ');const lines=[];let cur='';words.forEach(w=>{if((cur+' '+w).trim().length>max&&cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()});lines.push(cur);lines.slice(0,3).forEach((l,i)=>txt(g,x,y+i*12,l,{'text-anchor':'middle'}));}
function legendHTML(items){return items.map(i=>`<span><i ${i.line?'class="ln"':''} style="background:${i.color}"></i>${i.name}</span>`).join('');}
const f1=v=>v.toFixed(1), f0=v=>Math.round(v).toLocaleString('en-MY');
const rm=v=>(v<0?'-':'')+'RM'+Math.abs(Math.round(v)).toLocaleString('en-MY')+'m';
const rmS=v=>(v>0?'+':'')+rm(v);

/* ---------- bar chart (grouped / stacked, supports negatives) ---------- */
function bars(id,o){
  const H=o.height||260;const {s,w}=mk(id,H);const m={l:o.ml||48,r:12,t:12,b:o.mb||38};
  const cats=o.cats, ser=o.series;let lo=0,hi=0;
  cats.forEach((c,i)=>{if(o.stacked){let p=0,n=0;ser.forEach(se=>{const v=se.values[i];if(v>=0)p+=v;else n+=v});hi=Math.max(hi,p);lo=Math.min(lo,n);}else ser.forEach(se=>{hi=Math.max(hi,se.values[i]);lo=Math.min(lo,se.values[i])});});
  if(o.line)o.line.values.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)});
  if(o.yMin!==undefined)lo=o.yMin; if(o.yMax!==undefined)hi=o.yMax;
  const tk=ticks(lo,hi,o.nt||5);lo=tk[0];hi=tk[tk.length-1];
  const y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));const base=lo>0?lo:(hi<0?hi:0);
  const g=el('g',{},s);
  tk.forEach(v=>{el('line',{x1:m.l,x2:w-m.r,y1:y(v),y2:y(v),stroke:v===0?C.axis:C.grid,'stroke-width':1},g);txt(g,m.l-6,y(v)+4,(o.tfmt||(x=>x))(v),{'text-anchor':'end',class:'tick'});});
  const bw=(w-m.l-m.r)/cats.length;
  cats.forEach((c,i)=>{
    const x0=m.l+i*bw;
    if(o.stacked){const bwid=Math.min(o.maxBar||44,bw*0.62);let p=0,n=0;const xs=x0+(bw-bwid)/2;
      const pos=ser.map((se,j)=>({j,v:se.values[i]})).filter(d=>d.v>=0);const neg=ser.map((se,j)=>({j,v:se.values[i]})).filter(d=>d.v<0);
      pos.forEach((d,k)=>{const y0=y(p),y1=y(p+d.v);p+=d.v;const last=k===pos.length-1;const gap=k>0?1:0;
        const pth=last?rpath(xs,y0-gap,y1,bwid):`M${xs},${y0-gap}V${y1+1}H${xs+bwid}V${y0-gap}Z`;
        el('path',{d:pth,fill:ser[d.j].color,'data-tip':`${c}\n${ser[d.j].name}: ${(o.fmt||f1)(d.v)}`},g);});
      neg.forEach((d,k)=>{const y0=y(n),y1=y(n+d.v);n+=d.v;const last=k===neg.length-1;
        el('path',{d:last?rpath(xs,y0,y1,bwid):`M${xs},${y0}V${y1}H${xs+bwid}V${y0}Z`,fill:ser[d.j].color,'data-tip':`${c}\n${ser[d.j].name}: ${(o.fmt||f1)(d.v)}`},g);});
    } else {const n=ser.length;const bwid=Math.min(o.maxBar||34,(bw*0.72-(n-1)*2)/n);const tot=n*bwid+(n-1)*2;
      ser.forEach((se,j)=>{const v=se.values[i];const xs=x0+(bw-tot)/2+j*(bwid+2);const col=typeof se.color==='function'?se.color(v,i):se.color;
        el('path',{d:rpath(xs,y(base),y(v),bwid),fill:col,'data-tip':`${c}\n${se.name}: ${(o.fmt||f1)(v)}`},g);
        if(o.labels){txt(g,xs+bwid/2,v>=0?y(v)-5:y(v)+13,(o.lfmt||o.fmt||f1)(v),{'text-anchor':'middle',style:'font-weight:600;fill:#0b0b0b'});}
      });}
    wrapLabel(g,x0+bw/2,H-m.b+15,c,o.wrap||13);
  });
  if(o.line){const L=o.line;const pts=cats.map((c,i)=>[m.l+i*bw+bw/2,y(L.values[i])]);
    el('path',{d:'M'+pts.map(p=>p.join(',')).join('L'),fill:'none',stroke:L.color||'#0b0b0b','stroke-width':2},g);
    pts.forEach((p,i)=>el('circle',{cx:p[0],cy:p[1],r:4.5,fill:L.color||'#0b0b0b',stroke:'#fff','stroke-width':2,'data-tip':`${cats[i]}\n${L.name}: ${(o.fmt||f1)(L.values[i])}`},g));}
  return {y,m,w};
}
/* ---------- horizontal bars ---------- */
function hbars(id,o){
  const rowH=o.rowH||24;const H=o.cats.length*rowH+24;const {s,w}=mk(id,H);const ml=o.ml||150,mr=o.mr||56;
  const mx=Math.max(...o.values)*1.02;const x=v=>ml+(w-ml-mr)*v/mx;const g=el('g',{},s);
  o.cats.forEach((c,i)=>{const yy=6+i*rowH;txt(g,ml-8,yy+rowH/2+2,c,{'text-anchor':'end'});
    const col=o.colors?o.colors[i]:(o.color||C.s1);const bh=Math.min(14,rowH-8);
    const x1=x(o.values[i]);const r=Math.min(4,bh/2);
    el('path',{d:`M${ml},${yy+(rowH-bh)/2}H${x1-r}Q${x1},${yy+(rowH-bh)/2} ${x1},${yy+(rowH-bh)/2+r}V${yy+(rowH+bh)/2-r}Q${x1},${yy+(rowH+bh)/2} ${x1-r},${yy+(rowH+bh)/2}H${ml}Z`,fill:col,'data-tip':`${c}: ${(o.fmt||f1)(o.values[i])}${o.extra?'\n'+o.extra[i]:''}`},g);
    txt(g,x1+6,yy+rowH/2+4,(o.fmt||f1)(o.values[i]),{style:'fill:#0b0b0b;font-weight:600'});});
  el('line',{x1:ml,x2:ml,y1:2,y2:H-14,stroke:C.axis},g);
}
/* ---------- line chart with crosshair ---------- */
function lines(id,o){
  const H=o.height||240;const {s,w}=mk(id,H);const m={l:o.ml||44,r:o.mr||14,t:12,b:30};
  let lo=Infinity,hi=-Infinity;o.series.forEach(se=>se.values.forEach(v=>{if(v==null)return;lo=Math.min(lo,v);hi=Math.max(hi,v)}));
  if(o.band){o.band.lo.forEach(v=>{if(v!=null)lo=Math.min(lo,v)});o.band.hi.forEach(v=>{if(v!=null)hi=Math.max(hi,v)})}
  if(o.yMin!==undefined)lo=o.yMin;if(o.yMax!==undefined)hi=o.yMax;

function heat(id,o){

  o.rows.forEach((r,i)=>{txt(g,cw0-8,24+i*rowH+rowH/2+2,r,{'text-anchor':'end'});
    o.cols.forEach((c,j)=>{const v=o.values[i][j];let fill,tc;

      else{const t=(v-mn)/(mx-mn||1);const k=Math.round(t*(SEQ.length-1));fill=SEQ[k];tc=k>6?'#fff':'#0b0b0b';}
      el('rect',{x:cw0+j*cw+1,y:22+i*rowH+1,width:cw-2,height:rowH-2,rx:4,fill,'data-tip':`${r} · ${c}\n${(o.fmt||f1)(v)}`},g);
      if(o.showVals!==false)txt(g,cw0+j*cw+cw/2,22+i*rowH+rowH/2+4,(o.vfmt||o.fmt||f1)(v),{'text-anchor':'middle',style:`fill:${tc};font-size:11px;font-weight:600;pointer-events:none`});});});

/* ---------- waterfall ---------- */

  let lo=Math.min(...segs.map(x=>Math.min(x.a,x.b))),hi=Math.max(...segs.map(x=>Math.max(x.a,x.b)));if(o.yMin!==undefined)lo=o.yMin;
  const tk=ticks(lo,hi,4);lo=tk[0];hi=tk[tk.length-1];const Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));const g=el('g',{},s);

    else el('rect',{x,y:top,width:bwid,height:Math.max(1.5,bot-top),rx:3,fill:col,'data-tip':`${sg.d.label}\n${sg.d.value>=0?'+':''}${(o.fmt||f1)(sg.d.value)}`},g);
    txt(g,x+bwid/2,top-5,(sg.d.total?'':(sg.d.value>=0?'+':''))+(o.lfmt||o.fmt||f1)(sg.d.value),{'text-anchor':'middle',style:'fill:#0b0b0b;font-weight:600'});
    if(i<segs.length-1){const nx=m.l+(i+1)*bw+(bw-bwid)/2;el('line',{x1:x+bwid,x2:nx,y1:Y(sg.b),y2:Y(sg.b),stroke:C.t3,'stroke-dasharray':'2 2'},g)}
    wrapLabel(g,m.l+i*bw+bw/2,H-m.b+15,sg.d.label,o.wrap||12);});
}

/* canonical OPR engine: every page that quotes an OPR result must call this so numbers agree */
const BAL={varLoans:359150,liq:22000,fdmmd:329690,interbank:20000,sav:50110,dem:77720,yield:543000};
function oprDefaults(){return {shock:-25,pt:100,lag:1,fd:100,sav:40,dem:0}}
function simulate(p){
  const s=p.shock/10000;const pt=p.pt/100,fd=p.fd/100,dem=p.dem/100;let sav=p.sav/100;
  if(s<0)sav=Math.min(sav,0.0020/Math.abs(s));
  const f=m=>m===1?Math.max(0,1-p.lag/4.33):1;const cum=m=>m<=6?0.789*m/6:0.789+0.209*(m-6)/6;
  const months=[];let loans=0,fdT=0;
  for(let m=1;m<=12;m++){const a=s*(BAL.varLoans*pt*f(m)+BAL.liq)/12;const l=s*(BAL.fdmmd*fd*cum(m)+BAL.interbank+BAL.sav*sav+BAL.dem*dem)/12;months.push(a-l);loans+=s*BAL.varLoans*pt*f(m)/12;fdT+=-s*BAL.fdmmd*fd*cum(m)/12;}
  const run=(s*(BAL.varLoans*pt+BAL.liq)-s*(BAL.fdmmd*fd*0.998+BAL.interbank+BAL.sav*sav+BAL.dem*dem))/12;
  const parts={loans,liq:s*BAL.liq,fd:fdT,ib:-s*BAL.interbank,casa:-s*(BAL.sav*sav+BAL.dem*dem)};
  const total=months.reduce((a,b)=>a+b,0);
  const perm=s*(BAL.sav*(1-sav)+BAL.dem*(1-dem));
  const eve=p.shock<0?FIG.eveM100*Math.abs(p.shock)/100:FIG.eveP100*p.shock/100;
  return {months,run,parts,total,perm,eve,nim:total/BAL.yield*10000};
}

/* ================= sortable table =================
   table(host,{cols:[{k,l,n:true,fmt}],rows:[{...}],onRow:(row,tr)=>{},rowClass:row=>''}) */
function table(host,o){
  const h=typeof host==='string'?$(host):host;let sk=o.sort||null,dir=-1;
  const draw=()=>{let rows=o.rows.slice();if(sk)rows.sort((a,b)=>{const x=a[sk],y=b[sk];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*dir});

    h.querySelectorAll('th').forEach(th=>th.onclick=()=>{if(sk===th.dataset.k)dir=-dir;else{sk=th.dataset.k;dir=-1}draw()});

/* ================= streaming AI answer =================
   aiAnswer(host,{agent:'Genie: ALM Analyst', steps:[['Querying','<code>main.pbb_finance.gold.repricing_gap</code>'],...],
     headline:'...', bullets:['html',...], kc:[['12m NII','-RM271m','dn'],...], chart:(id)=>{ draw into $(id) },
     sql:'SELECT ...', sources:['Pillar 3 Jun-26 p.37',...], followups:[['question text', ()=>{...}]], conf:0.94 }, {append:true})
   Returns a Promise that resolves when streaming completes. */
let _aiN=0;
/* ================= agent pacing =================
   One knob for how "live" agent runs feel. Steps run PACE.step x their nominal time (min PACE.min ms),
   the first step waits PACE.think ms extra, streamed text runs PACE.word x slower. ?pace=0.5 halves it, ?pace=1.5 slows it more. */
const PACE=(()=>{const m=+(new URLSearchParams(location.search).get('pace')||1)||1;return{step:2.2*m,min:1000*m,think:1200*m,word:2.4*m};})();
const paceMs=(ms,i=0,key='')=>{const j=0.85+0.3*Math.abs(Math.sin((i+1)*12.9898+String(key).length*78.233)%1);return Math.round(Math.max(PACE.min,ms*PACE.step)*j+(i===0?PACE.think:0));};
const wordMs=ms=>Math.round(ms*PACE.word);
function aiAnswer(host,a,opt={}){
  const h=typeof host==='string'?$(host):host;const id='ai'+(++_aiN);
  const box=document.createElement('div');box.className='ai fade-in';box.id=id;
  box.innerHTML=`<div class="who"><span class="av">✦</span><b>${a.agent||'Databricks AI agent'}</b><span class="muted">${a.sub||'Agent Bricks · grounded in Unity Catalog'}</span></div><ul class="stepsl"></ul><div class="body"></div>`;
  if(opt.append)h.appendChild(box);else{h.innerHTML='';h.appendChild(box);}
  const ul=box.querySelector('.stepsl'),body=box.querySelector('.body');const steps=a.steps||[];const fast=opt.fast;
  return new Promise(res=>{
    let i=0;const nextStep=()=>{if(i>0)ul.children[i-1].className='ok';
      if(i<steps.length){const li=document.createElement('li');li.className='run';li.innerHTML=`<span class="s"></span><span><b>${steps[i][0]}</b> ${steps[i][1]||''}</span>`;ul.appendChild(li);setTimeout(nextStep,fast?60:paceMs(380+Math.random()*260,i+1,steps[i][0]));i++;}
      else streamBody();};
    const streamBody=()=>{const hl=document.createElement('div');hl.className='hl cursor';body.appendChild(hl);const words=(a.headline||'').split(' ');let w=0;
      const t=setInterval(()=>{hl.textContent=words.slice(0,++w).join(' ');if(w>=words.length){clearInterval(t);hl.classList.remove('cursor');rest();}},fast?4:wordMs(28));};
    const rest=()=>{let html='';
      if(a.kc)html+=`<div class="kc">${a.kc.map(k=>`<div><span>${k[0]}</span><b class="${k[2]||''}">${k[1]}</b></div>`).join('')}</div>`;
      if(a.bullets)html+=`<ul class="bl">${a.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
      if(a.html)html+=a.html;
      if(a.chart)html+=`<div class="chartbox chart" id="${id}_ch"></div>`;
      if(a.sources)html+=`<div class="srcs">${a.sources.map(s=>`<span>${s}</span>`).join('')}</div>`;
      if(a.sql)html+=`<details><summary>Generated SQL${a.conf?` · confidence ${Math.round(a.conf*100)}%`:''}</summary><pre class="sql">${sqlHL(a.sql)}</pre></details>`;
      if(a.followups)html+=`<div class="fu">${a.followups.map((f,j)=>`<button class="chip" data-j="${j}">${f[0]}</button>`).join('')}</div>`;
      const d=document.createElement('div');d.className='fade-in';d.innerHTML=html;body.appendChild(d);
      if(a.chart)a.chart(id+'_ch');
      d.querySelectorAll('.fu .chip').forEach(b=>b.onclick=()=>a.followups[+b.dataset.j][1]());
      if(h.scrollHeight>h.clientHeight)h.scrollTop=h.scrollHeight;res(box);};
    if(fast)nextStep();else{const th=document.createElement('li');th.className='run';th.innerHTML='<span class="s"></span><span><b>Thinking</b></span>';ul.appendChild(th);setTimeout(()=>{th.remove();nextStep();},PACE.think);}

/* ================= dial (drag to set a value) =================
   dial(hostId,{min,max,step,value,size,label,fmt:v=>str,sub:v=>str,detents:[values],color,onChange:v=>{}})
   Drag the knob around a 270° arc, scroll, or use arrow keys. Returns {set(v),get()}. */
function dial(host,o){const h=typeof host==='string'?$(host):host;const S=o.size||190,R=S/2-16,cx=S/2,cy=S/2;const A0=135,A1=405;let v=o.value??0;
  const ang=x=>A0+(A1-A0)*(x-o.min)/(o.max-o.min);const pt=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];

  h.innerHTML='';h.classList.add('kdial');h.tabIndex=0;const s=el('svg',{viewBox:`0 0 ${S} ${S}`,width:S,height:S},h);
  el('path',{d:arc(A0,A1,R),stroke:'#ebe9e4','stroke-width':12,fill:'none','stroke-linecap':'round'},s);
  const zero=o.min<0&&o.max>0?0:o.min;const fill=el('path',{stroke:o.color||'var(--brand)','stroke-width':12,fill:'none','stroke-linecap':'round'},s);
  (o.detents||[]).forEach(d=>{const [x0,y0]=pt(ang(d),R+9),[x1,y1]=pt(ang(d),R+14);el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:'#b9b7b1','stroke-width':1.5},s);const [tx,ty]=pt(ang(d),R+24);if(S>=170)txt(s,tx,ty+3,(d>0?'+':'')+d,{'text-anchor':'middle','font-size':9.5,fill:'#8a8984'});});
  const knob=el('circle',{r:10,fill:'#fff',stroke:o.color||'var(--brand)','stroke-width':3,style:'cursor:grab'},s);
  const big=txt(s,cx,cy+4,'',{'text-anchor':'middle','font-size':S/6.2,'font-weight':750,fill:'#0b0b0b'});const sub=txt(s,cx,cy+S/8+6,'',{'text-anchor':'middle','font-size':11,fill:'#8a8984'});
  if(o.label)txt(s,cx,cy-S/7,o.label,{'text-anchor':'middle','font-size':10.5,fill:'#8a8984','letter-spacing':'.6'});
  const draw=()=>{const a=ang(v),az=ang(zero);fill.setAttribute('d',Math.abs(a-az)<0.5?'':arc(Math.min(a,az),Math.max(a,az),R));const [kx,ky]=pt(a,R);knob.setAttribute('cx',kx);knob.setAttribute('cy',ky);big.textContent=o.fmt?o.fmt(v):v;sub.textContent=o.sub?o.sub(v):'';};
  const set=(x,emit=true,snap=false)=>{const st=o.step||1;x=Math.round(Math.max(o.min,Math.min(o.max,x))/st)*st;if(snap&&o.detents){const d=o.detents.find(d=>Math.abs(d-x)<st);if(d!==undefined)x=d;}if(x===v&&emit!=='force'){draw();return;}v=x;draw();if(emit&&o.onChange)o.onChange(v);};
  const fromEvt=e=>{const r=s.getBoundingClientRect();const p=e.touches?e.touches[0]:e;let a=Math.atan2(p.clientY-(r.top+r.height/2),p.clientX-(r.left+r.width/2))*180/Math.PI;if(a<0)a+=360;if(a<A0-90)a+=360;a=Math.max(A0,Math.min(A1,a));return o.min+(o.max-o.min)*(a-A0)/(A1-A0);};
  let drag=false;const down=e=>{drag=true;knob.style.cursor='grabbing';set(fromEvt(e),true,true);e.preventDefault();};
  s.addEventListener('mousedown',down);s.addEventListener('touchstart',down,{passive:false});
  addEventListener('mousemove',e=>{if(drag)set(fromEvt(e),true,true)});addEventListener('touchmove',e=>{if(drag){set(fromEvt(e),true,true);e.preventDefault()}},{passive:false});

  h.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){set(v+(o.step||1));e.preventDefault()}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){set(v-(o.step||1));e.preventDefault()}});
  draw();return {set:x=>set(x,true),get:()=>v};}

/* ================= gauge (ratio vs regulatory minimum) =================
   gauge(hostId,{value,min:100,max:200,label:'LCR',fmt,prev,color,badge:'Published'|'Modelled'})
   Ring fills to value; red tick at the minimum; colour turns amber within 10pts and red below the minimum. */
function gauge(host,o){const h=typeof host==='string'?$(host):host;const S=o.size||150,R=S/2-12,cx=S/2,cy=S/2,C2=2*Math.PI*R;
  const frac=x=>Math.max(0,Math.min(1,x/(o.max||200)));const val=o.value,mn=o.min??100;

  const ring=el('circle',{cx,cy,r:R,fill:'none',stroke:col,'stroke-width':11,'stroke-linecap':'round','stroke-dasharray':`${C2*frac(o.prev??val)} ${C2}`,transform:`rotate(-90 ${cx} ${cy})`,style:'transition:stroke-dasharray .6s ease,stroke .3s'},s);
  requestAnimationFrame(()=>ring.setAttribute('stroke-dasharray',`${C2*frac(val)} ${C2}`));setTimeout(()=>ring.setAttribute('stroke-dasharray',`${C2*frac(val)} ${C2}`),30);
  const ma=frac(mn)*2*Math.PI-Math.PI/2;el('line',{x1:cx+(R-9)*Math.cos(ma),y1:cy+(R-9)*Math.sin(ma),x2:cx+(R+9)*Math.cos(ma),y2:cy+(R+9)*Math.sin(ma),stroke:'#0b0b0b','stroke-width':2.5,'data-tip':`Regulatory minimum ${mn}%`},s);

  txt(s,cx,cy+S/4.2,`min ${mn}% · +${(val-mn).toFixed(1)}pp`,{'text-anchor':'middle','font-size':10.5,fill:val<mn?'#b42d2d':'#52514e'});
  s.setAttribute('data-tip',`${o.label}: ${val.toFixed(1)}% against a ${mn}% minimum`);}

/* tabs(hostId,[{id,l,cnt,ic}],onChange,{style:'line'|'pill',value,panesRoot}) -> {set(id),get()}

/* timeline(hostId,{title,status,stops:[{l,s,t}],value,dark,speed,loop,onChange:(i,frac)=>{}}) -> {set(p),play(),stop(),get()}
   Scrubber with play button. While playing, onChange fires ~25 times a second with the stop index and a 0..1 fraction. */
function timeline(host,o){const h=typeof host==='string'?$(host):host;h.className='tline'+(o.dark===false?' light':'');const n=o.stops.length;let pos=o.value??0,timer=null;
  h.innerHTML=`<div class="th"><button class="play" title="Play">▶</button><span>${o.title||''}</span><b class="tst">${o.status||''}</b><span class="t"></span></div><div class="track"><div class="fillb"></div><div class="knob"></div></div><div class="stops">${o.stops.map((s,i)=>`<div data-i="${i}">${s.l}${s.s?`<span>${s.s}</span>`:''}</div>`).join('')}</div>`;
  const fill=h.querySelector('.fillb'),knob=h.querySelector('.knob'),btn=h.querySelector('.play'),tt=h.querySelector('.t');
  const draw=()=>{const f=n>1?pos/(n-1):1;fill.style.width=(f*100)+'%';knob.style.left=(f*100)+'%';const i=Math.round(pos);h.querySelectorAll('.stops div').forEach((d,j)=>d.classList.toggle('on',j<=i));const st=o.stops[Math.min(n-1,i)];tt.textContent=st.t||st.l;};
  const set=(p,emit=true)=>{pos=Math.max(0,Math.min(n-1,p));draw();if(emit&&o.onChange)o.onChange(Math.round(pos),n>1?pos/(n-1):1);};

  const play=()=>{if(timer){stop();return}if(pos>=n-1)set(0);btn.textContent='❚❚';const step=1/((o.speed||700)/40);timer=setInterval(()=>{const np=pos+step;if(np>=n-1){set(n-1);if(o.loop)set(0);else stop();}else set(np);},40);};

/* ring(hostId,{value,max,text,sub,status,statusColor,size,color}) score ring like the reference credit score; animates in */
function ring(host,o){const h=typeof host==='string'?$(host):host;const S=o.size||170,R=S/2-12,C2=2*Math.PI*R;const f=Math.max(0,Math.min(1,o.value/(o.max||100)));
  h.className='ring';h.innerHTML=`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><circle cx="${S/2}" cy="${S/2}" r="${R}" fill="none" stroke="#f1f2f4" stroke-width="12"/><circle class="rg" cx="${S/2}" cy="${S/2}" r="${R}" fill="none" stroke="${o.color||'#c8102e'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 ${C2}" transform="rotate(-90 ${S/2} ${S/2})" style="transition:stroke-dasharray 1s cubic-bezier(.3,.7,.2,1)"/></svg><div class="rv"><b>${o.text??o.value}</b><span>${o.sub||''}</span>${o.status?`<em style="color:${o.statusColor||'var(--teal)'}">${o.status}</em>`:''}</div>`;
  const c=h.querySelector('.rg');setTimeout(()=>c.setAttribute('stroke-dasharray',`${C2*f} ${C2}`),40);}
/* agentRun(hostId,{steps:[[label,detail,ms]],fast,done}) reveals tool steps one by one, then calls done(). Returns Promise. */
function agentRun(host,o){const h=typeof host==='string'?$(host):host;h.className='arun going';h.innerHTML=o.steps.map(s=>`<div class="st"><i></i><div><b>${s[0]}</b> ${s[1]||''}</div><span class="tm"></span></div>`).join('');
  const els=[...h.querySelectorAll('.st')];let i=0;return new Promise(res=>{const nx=()=>{if(i>0)els[i-1].className='st v ok';if(i<els.length){els[i].className='st v run';const ms=paceMs(o.steps[i][2]||420+Math.random()*300,i,o.steps[i][0]);els[i].querySelector('.tm').textContent=(ms/1000).toFixed(1)+'s';i++;setTimeout(nx,o.fast?60:ms);}else{o.done&&o.done();res();}};nx();});}
/* trace([...]) -> html for a subtle Databricks provenance line (mono chips) */
const trace=items=>`<div class="trace">${items.map(x=>`<span>${x}</span>`).join('')}</div>`;
/* countUp(el,to,{from,dur,fmt}) */
function countUp(e,to,o={}){const el2=typeof e==='string'?$(e):e;if(!el2)return;const from=o.from||0,d=o.dur||900,t0=performance.now();const f=o.fmt||(v=>Math.round(v).toLocaleString('en-MY'));const step=t=>{const k=Math.max(0,Math.min(1,(t-t0)/d)),v=from+(to-from)*(1-Math.pow(1-k,3));el2.textContent=f(v);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);setTimeout(()=>el2.textContent=f(to),d+60);}

function heroDraw(p){heroP=p;if(!H.bars)return;const {Y,bwid}=H;let nim=NIM0;

function tideFlow(dir){if(!T.s)return;const {Y,X,pg}=T;const to=behav();const lanes=[];

  const N=30,t0=performance.now();const ps=[];
  for(let k=0;k<N;k++){const ln=lanes[k%lanes.length];const p0=dir>0?ln.a:ln.b,p1=dir>0?ln.b:ln.a;

/* ---------------- typed command, parsed by an agent ---------------- */
function parseCmd(q,sc){const t=q.toLowerCase();const out=[];const n=JSON.parse(JSON.stringify(sc));
  const mv=t.match(/(cut|lower|reduce|ease|hike|raise|increase|tighten)\D{0,12}(\d{2,3})\s*(bp|bps|basis)/);
  const mon=t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s*(20\d\d|\d\d)?/);
  if(mv){const bp=+mv[2]*(/(cut|lower|reduce|ease)/.test(mv[1])?-1:1);let idx=2;
    if(mon){const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(mon[1]);const yr=mon[2]?(+mon[2]<100?2000+ +mon[2]:+mon[2]):(mi>=10?2026:2027);idx=clamp((yr-2026)*12+mi-10,0,23);}
    const base=n.path[idx];for(let k=idx;k<24;k++)n.path[k]=clamp(+(base+bp/100).toFixed(2),LO,HI);out.push(`OPR <code>${bp>0?'+':''}${bp}bp from ${MLAB[idx]}</code>`);}
  const beta=(re,key,lab)=>{const r=t.match(re);if(r){let v=parseFloat(r[1]);if(v>1)v/=100;n[key]=Math.round(clamp(v,0,1)*100);out.push(`${lab} <code>${v.toFixed(2)}</code>`);}};
  beta(/fd\s*beta\s*(?:of|to|=|at)?\s*(\d?\.\d+|\d+%?)/,'fd','FD beta');beta(/sav\w*\s*beta\s*(?:of|to|=|at)?\s*(\d?\.\d+|\d+%?)/,'sav','savings beta');
  const pt=t.match(/pass[- ]?through\s*(?:of|to|=|at)?\s*(\d+)/);if(pt){n.pt=clamp(+pt[1],0,100);out.push(`loan pass-through <code>${n.pt}%</code>`);}
  if(/hold|unchanged|no change/.test(t)&&!mv){n.path=flat(FIG.opr);out.push(`OPR <code>held at ${pct(FIG.opr,2)}</code>`);}
  return {out,sc:n};}
function runCmd(){if(S.busy)return;const q=$('scn_in').value.trim();if(!q){$('scn_in').focus();return;}
  const r=parseCmd(q,S.sc);const slot=$('scn_slot');slot.innerHTML='<div class="rh">Scenario agent</div><div id="scn_run"></div>';S.busy=true;
  const steps=r.out.length?[['Parsing',`“${esc(q).slice(0,60)}”`,420],['Understood',r.out.join(' · '),460],['Running',`<code>simulate_nii_path()</code> for 24 months`,520]]
    :[['Parsing',`“${esc(q).slice(0,60)}”`,420],['Not understood','try “cut OPR 50bp in March 2027, FD beta 0.8”',300]];
  agentRun('scn_run',{steps,done:()=>{S.busy=false;if(!r.out.length){toast('Could not read that command');return;}S.sc=r.sc;S.ptab&&S.ptab.set(null);update(true);$('scn_in').value='';toast('Scenario updated: '+label(S.sc));}});}

function capWfBuild(){const host=$('gfaWf');const W=Math.max(560,host.clientWidth),HH=300;const {s}=mk(host,HH);const m={l:44,r:8,t:26,b:46};

function capWfSet(first){const w=C3.wf;if(!w)return;const tgt=capWfTarget();const from=w.first?tgt.map((v,i)=>WF[i]&&WF[i][2]?v:0):w.cur.slice();

const byId=id=>RULES.find(r=>r.id===id);
RULES.forEach(r=>{r.fixed=false;r.pr=null;r.shown=false;r.res=r.tests.map(()=>'idle');});
const isDef=r=>r.bad.length>0;
let scanned=false,scanning=false,busy=false,sel=byId('MMD_ACCRUE'),prN=481,kv={def:0,pnl:0,cyc:0};

function fixedLines(r){const out=[];r.sql.forEach((l,i)=>{const f=r.fix&&r.fix[i+1];if(f)f.forEach(x=>out.push({t:x,add:1}));else out.push({t:l,o:i+1});});return out;}
const lineEl=n=>$('gfcCode').querySelector(`.gfc-ln[data-n="${n}"]`);
const dotCol=r=>!r.shown?'#d6d9df':r.fixed?'#0f9f8f':SEVC[r.sev];
function rowTag(r){if(!r.shown)return '';if(r.fixed)return `<em class="ok">${r.pr==='merged'?'deployed':'fixed'}</em>`;return isDef(r)?`<em style="color:${SEVC[r.sev]}">${r.sev}</em>`:'<em class="ps">pass</em>';}

function drawList(){const open=RULES.filter(r=>r.shown&&isDef(r)&&!r.fixed).length;
  $('gfcList').innerHTML=`<div class="gfc-lh"><span>Rules in release</span><b>${scanned?open+' open':RULES.length}</b></div>`+RULES.map(r=>`<div class="gfc-r ${r===sel?'on':''}" data-id="${r.id}"><i class="dt" style="background:${dotCol(r)}"></i><div class="nm"><b>${r.id}</b><span>${r.product}</span></div>${rowTag(r)}</div>`).join('');
  $('gfcList').querySelectorAll('.gfc-r').forEach(d=>d.onclick=()=>{if(busy||scanning)return;sel=byId(d.dataset.id);closePop();drawList();drawCode(true);drawStrip();});}
function popDot(r){const d=$('gfcList').querySelector(`.gfc-r[data-id="${r.id}"]`);if(!d)return;const dt=d.querySelector('.dt');dt.style.background=dotCol(r);dt.classList.remove('pop');void dt.offsetWidth;dt.classList.add('pop');
  const old=d.querySelector('em');if(old)old.remove();d.insertAdjacentHTML('beforeend',rowTag(r));}

function drawCode(anim){const r=sel;const lines=r.fixed?fixedLines(r):r.sql.map((t,i)=>({t,o:i+1}));
  $('gfcCode').innerHTML=lines.map((x,i)=>`<div class="gfc-ln${x.add?' add':''}" data-n="${x.o||''}"><span class="gfc-no">${i+1}</span><span class="gfc-mk"></span><code>${sqlHL(x.t)}</code></div>`).join('');
  $('gfcFile').textContent=r.file;
  $('gfcBr').innerHTML=r.fixed?`<i class="g"></i>${r.branch}`:'<i></i>main';
  const nb=r.bad.length;
  $('gfcSt').innerHTML=!scanned?'not scanned':r.fixed?'<span class="ok">fix applied · tests green</span>':nb?`<span class="bd">${nb} defective line${nb>1?'s':''}</span> · click a marker`:'<span class="ok">no defects</span>';
  if(scanned&&r.shown&&!r.fixed&&nb){r.bad.forEach((n,k)=>{const go=()=>{const e=lineEl(n);if(!e)return;e.classList.add('bad','lit');e.onclick=()=>showPop(n);};if(anim)setTimeout(go,260+k*420);else go();});
    if(anim)setTimeout(()=>{if(sel===r&&!r.fixed&&!busy)showPop(r.bad[0]);},360+nb*420);}}

function closePop(){const p=$('gfcCode')&&$('gfcCode').parentElement.querySelector('.gfc-pop');if(p)p.remove();document.querySelectorAll('#gfcCode .gfc-ln.sel').forEach(x=>x.classList.remove('sel'));}
function showPop(n){closePop();const r=sel,e=lineEl(n);if(!e||r.fixed)return;e.classList.add('sel');const host=$('gfcCode').parentElement;
  const p=document.createElement('div');p.className='gfc-pop';const k=r.bad.indexOf(n);
  p.innerHTML=`<div class="ph1"><span class="sv" style="background:${SEVC[r.sev]}1a;color:${SEVC[r.sev]}"><i style="background:${SEVC[r.sev]}"></i>${r.sev}</span><span class="mono">${r.id} · line ${e.querySelector('.gfc-no').textContent}</span><button class="x" title="Close">×</button></div>
   <b class="t">${k>0?'Same defect, second occurrence':r.title}</b><p>${r.ex[n]}</p>
   <div class="im"><b>${r.imp[0]}</b><span>${r.imp[1]}</span></div>
   ${k===0?`<table class="gl"><tr><th>${r.pnl?'GL, RM m':'Return line'}</th><th>Now</th><th>Fixed</th></tr>${r.gl.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join('')}</table>`:''}
   <div class="rf">${r.ref}</div>
   <div class="ac"><button class="btn primary sm" data-a="fix">Apply fix</button><span class="mono">${r.branch}</span></div>`;
  host.appendChild(p);
  const ch=host.clientHeight,ph=p.offsetHeight;let top=e.offsetTop+$('gfcCode').offsetTop-14;top=Math.max(48,Math.min(top,ch-ph-10));p.style.top=top+'px';
  p.style.setProperty('--ay',(e.offsetTop+$('gfcCode').offsetTop+11-top)+'px');
  p.querySelector('.x').onclick=closePop;p.querySelector('[data-a=fix]').onclick=applyFix;}

function applyFix(){const r=sel;if(busy||r.fixed||!isDef(r))return;busy=true;closePop();
  $('gfcSt').innerHTML='<span class="run">writing fix to '+r.branch+'</span>';
  const keys=Object.keys(r.fix).map(Number).sort((a,b)=>a-b);let i=0;
  const nx=()=>{if(i>=keys.length){setTimeout(()=>{r.fixed=true;GFB.fixed=RULES.filter(x=>x.fixed).length;drawCode(false);popDot(r);drawList();runTests(r);},380);return;}
    const n=keys[i++],e=lineEl(n);if(!e){nx();return;}e.classList.remove('bad','lit','sel');e.classList.add('del');e.onclick=null;
    setTimeout(()=>{let after=e;r.fix[n].forEach((t,j)=>{const d=document.createElement('div');d.className='gfc-ln add enter';d.style.animationDelay=(j*90)+'ms';d.innerHTML=`<span class="gfc-no"></span><span class="gfc-mk"></span><code>${sqlHL(t)}</code>`;after.after(d);after=d;});
      e.classList.add('out');setTimeout(nx,520);},420);};
  nx();}

function runTests(r){r.res=r.res.map(()=>'idle');drawStrip();let i=0;
  const st=()=>{if(i>0)r.res[i-1]='pass';if(i<r.tests.length){r.res[i]='run';i++;drawStrip();setTimeout(st,190*PACE.step);}else{drawStrip();busy=false;kpiUpdate();
    const c=$('gfcCyc');if(c)gfbCount(c,cyc(),{from:cyc()-r.cycles,dur:900});toast(`${r.id}: ${r.tests.length} of ${r.tests.length} regression cases pass`);insight();}};
  st();}
const cyc=()=>RULES.filter(r=>r.fixed).reduce((a,r)=>a+(r.cycles||0),0);

function drawStrip(){const r=sel;const p=r.res.filter(x=>x==='pass').length,f=r.res.filter(x=>x==='fail').length;
  const lab={idle:'not run',run:'running',pass:'pass',fail:'fail'};
  const pr=!isDef(r)?`<span class="gfc-nc">No change needed</span>`:prHtml(r);
  $('gfcStrip').innerHTML=`<div class="gfc-sl"><span>Regression suite</span><b>${scanned?`<span class="${f?'bd':'ok'}">${p} / ${r.tests.length}</span> passed`:'not run'}</b></div>
   <div class="gfc-pills">${r.tests.map((t,i)=>`<span class="gfc-pill ${r.res[i]}" data-tip="T${i+1} · ${t[0]}\n${lab[r.res[i]]}">${r.res[i]==='pass'?'✓':r.res[i]==='fail'?'✕':''}<small>T${i+1}</small></span>`).join('')}</div>
   <div class="gfc-sl"><span>UAT cycles avoided</span><b class="mono" id="gfcCyc">${cyc()}</b></div><div class="gfc-prw">${pr}</div>`;
  const ob=$('gfcStrip').querySelector('[data-a=pr]');if(ob)ob.onclick=openPR;const ab=$('gfcStrip').querySelector('[data-a=ap]');if(ab)ab.onclick=approve;}
function prHtml(r){const st=!r.fixed?0:!r.pr?1:r.pr==='open'?2:r.pr==='deploy'?3:4;
  const nodes=[['Maker','Treasury Accounting Analyst'],['Checker','Head, Treasury Accounting'],['Deploy','Asset Bundle · prod']];
  const stp=`<div class="gfc-stp">${nodes.map((x,i)=>{const s=st>=2?(i<st-1||st===4?'done':i===st-1?'cur':''):'';return `${i?`<i class="ln ${s==='done'||s==='cur'?'on':''}"></i>`:''}<span class="nd ${s}" data-tip="${x[0]}: ${x[1]}"><span class="k">${s==='done'?'✓':i+1}</span>${x[0]}</span>`;}).join('')}</div>`;
  if(st<2)return `<button class="btn ${st===1?'primary':''} sm" data-a="pr" ${st===1?'':'disabled'}>Open pull request</button>`;
  if(st===2)return stp+`<button class="btn sm" data-a="ap">Approve as checker</button>`;
  if(st===3)return stp+`<span class="gfc-nc run">deploying</span>`;
  return stp+`<span class="gfc-nc ok">PR #${r.prn} merged</span>`;}
function openPR(){const r=sel;if(!r.fixed||r.pr)return;r.prn=prN++;r.pr='open';drawStrip();toast(`Pull request #${r.prn} opened from ${r.branch}: maker cannot self-approve`);}
function approve(){const r=sel;if(r.pr!=='open')return;r.pr='deploy';drawStrip();setTimeout(()=>{r.pr='merged';if(sel===r)drawStrip();popDot(r);toast(`PR #${r.prn} approved, bundle deployed to prod`);},1300);}

function kpiUpdate(){const vals=$('gfcK').querySelectorAll('.val'),subs=$('gfcK').querySelectorAll('.sub');
  const def=RULES.filter(r=>r.shown&&isDef(r)&&!r.fixed).length,pnl=RULES.filter(r=>r.shown&&r.pnl&&!r.fixed).reduce((a,r)=>a+r.pnl,0),c=cyc();
  const crit=RULES.filter(r=>r.shown&&r.sev==='Critical'&&!r.fixed).length;
  gfbCount(vals[1],def,{from:kv.def,dur:700});gfbCount(vals[2],pnl,{from:kv.pnl,dur:900,fmt:v=>'RM'+v.toFixed(1)+'m'});gfbCount(vals[3],c,{from:kv.cyc,dur:900});
